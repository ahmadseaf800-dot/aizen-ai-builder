name: Aizen UI Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate Aizen platform upgrades
        run: node scripts/integrate-aizen.js
      - name: Validate frontend action wiring
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('frontend/index.html','utf8');
          const required=[
            ['message input','messageInput'],
            ['send action','sendMessage'],
            ['build action','buildProject'],
            ['new chat','newChat'],
            ['settings','openSettings']
          ];
          const missing=required.filter(([name,token])=>!html.includes(token));
          if(missing.length){
            console.error('Aizen UI guard failed:',missing.map(x=>x[0]).join(', '));
            process.exit(1);
          }
          const onclicks=[...html.matchAll(/onclick\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);
          const functionNames=new Set([...html.matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]));
          const externalSafe=['triggerFileUpload','closeAIModeModal','selectAIMode','openAIModeModal'];
          const broken=[];
          for(const raw of onclicks){
            const name=raw.trim().match(/^([A-Za-z_$][\w$]*)\s*\(/)?.[1];
            if(name && !functionNames.has(name) && !externalSafe.includes(name)) broken.push(name);
          }
          if(broken.length){
            console.error('Possibly unbound UI handlers:',[...new Set(broken)].join(', '));
            process.exit(1);
          }
          console.log('Aizen UI guard passed:', onclicks.length, 'inline actions checked');
          NODE
      - name: Validate backend and agent syntax
        run: |
          set -e
          node --check backend/server.js
          node --check backend/aizen-core.js
          node --check backend/aizen-agent-engine.js
          node --check backend/aizen-link-resolver.js
          node --check frontend/interaction.js
      - name: Commit integrated changes
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'aizen-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js frontend/interaction.js backend/aizen-agent-engine.js backend/aizen-link-resolver.js scripts/integrate-aizen.js
          git commit -m 'Integrate Aizen agent pipeline and resilient builder controls'
          git push
