name: Aizen integration

on:
  push:
    paths:
      - 'scripts/integrate-aizen.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration
        run: node scripts/integrate-aizen.js

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e
          node --check backend/server.js
          node --check backend/aizen-core.js
          node --check backend/aizen-agent-engine.js
          node --check backend/aizen-link-resolver.js
          node --check frontend/interaction.js

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes were necessary.'
            exit 0
          fi
          git config user.name 'aizen-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js frontend/interaction.js backend/aizen-agent-engine.js backend/aizen-link-resolver.js scripts/integrate-aizen.js
          git commit -m 'Integrate Aizen agent pipeline, direct links, owner controls and resilient buttons'
          git push
