name: Aizen checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax:
    if: ${{ !contains(github.event.head_commit.message, '[aizen-upgrade]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/aizen-core.js
          node --check backend/aizen-feature-engine.js
          node --check backend/aizen-workspace.js
      - name: Integrate Aizen platform upgrade
        run: node scripts/upgrade-agent-platform.js
      - name: Validate upgraded platform
        run: |
          node --check backend/server.js
          node --check backend/aizen-agent-orchestrator.js
          node --check backend/aizen-boilerplates.js
          node --check frontend/aizen-preview.js
          node --check frontend/interaction.js
      - name: Commit generated integration
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name 'Aizen Upgrade Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js frontend/aizen-preview.js backend/aizen-agent-orchestrator.js backend/aizen-boilerplates.js scripts/upgrade-agent-platform.js .github/workflows/aizen-check.yml
          git diff --cached --quiet || git commit -m '[aizen-upgrade] Integrate multi-agent pipeline and live preview'
          git push
      - name: Check fresh interaction layer
        run: node --check frontend/interaction.js
