name: Aizen CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check backend/server.js
      - run: node --check backend/aizen-core.js
      - run: node --check backend/aizen-knowledge.js
      - run: node --check backend/aizen-workspace.js
