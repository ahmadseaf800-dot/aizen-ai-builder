<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aizen AI Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d10;
      color: #f1f3f5;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      border-bottom: 1px solid #24272d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #0d0f12;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 18px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #181b21;
      border: 1px solid #30343b;
    }

    button {
      cursor: pointer;
    }

    .new-chat {
      border: 1px solid #30343b;
      background: #17191e;
      color: white;
      border-radius: 9px;
      padding: 8px 12px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 12px 145px;
    }

    .welcome {
      max-width: 700px;
      margin: 80px auto 0;
      text-align: center;
    }

    .welcome-icon {
      font-size: 45px;
    }

    .welcome h1 {
      font-size: 28px;
      margin: 15px 0 10px;
    }

    .welcome p {
      color: #999da5;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #181b21;
      border: 1px solid #2d3138;
    }

    .bubble {
      max-width: calc(100% - 50px);
      padding: 11px 14px;
      border-radius: 14px;
      background: #15181d;
      border: 1px solid #252930;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .user .bubble {
      background: #20242b;
    }

    .typing {
      color: #999da5;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 12px 14px;
      background: linear-gradient(
        to top,
        #0b0d10 75%,
        transparent
      );
    }

    .composer-wrap {
      max-width: 850px;
      margin: auto;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid #30343b;
      background: #14171b;
      border-radius: 15px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 150px;
      background: transparent;
      border: 0;
      outline: none;
      color: white;
      padding: 10px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea::placeholder {
      color: #777c85;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 1px solid #30343b;
      background: #1b1e23;
      color: white;
      font-size: 18px;
    }

    .send {
      background: white;
      color: #111;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .build {
      border: 1px solid #30343b;
      background: #15181d;
      color: white;
      padding: 8px 13px;
      border-radius: 9px;
    }

    .warning {
      color: #686d76;
      font-size: 11px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="logo">🤖</div>
      <span>Aizen AI</span>
    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ محادثة جديدة
    </button>

  </header>


  <main
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        🤖
      </div>

      <h1>Aizen AI</h1>

      <p>
        اسأل Aizen عن البرمجة أو بناء المواقع والتطبيقات والبوتات.
      </p>

    </div>

  </main>


  <div class="bottom">

    <div class="composer-wrap">

      <div class="composer">

        <button
          class="icon-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          ＋
        </button>

        <input
          id="fileInput"
          type="file"
          onchange="fileSelected(this)"
        >

        <textarea
          id="messageInput"
          placeholder="اسأل Aizen أي شيء..."
          rows="1"
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="icon-btn send"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>


      <div class="actions">

        <button
          class="build"
          onclick="buildProject()"
        >
          🛠️ Build
        </button>

        <div class="warning">
          Aizen AI يمكن أن يخطئ. تحقق من المعلومات المهمة.
        </div>

      </div>

    </div>

  </div>

</div>


<script>

const input =
  document.getElementById("messageInput");

const chat =
  document.getElementById("chat");


/*
  رابط Render الحقيقي.

  في الموقع المنشور:
  سيتم استخدام /api/chat.

  في Preview:
  سيتم استخدام Render مباشرة.
*/

const RENDER_URL =
  "https://aizen-ai-builder.onrender.com";


function getApiUrl() {

  const hostname =
    window.location.hostname;

  /*
    إذا كانت الصفحة على Render
    أو على الموقع نفسه
  */

  if (
    hostname ===
      "aizen-ai-builder.onrender.com"
  ) {

    return "/api/chat";

  }


  /*
    Preview أو أي بيئة أخرى
  */

  return (
    RENDER_URL +
    "/api/chat"
  );

}


/* =========================
   ENTER
========================= */

function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   MESSAGE
========================= */

function addMessage(
  text,
  type
) {

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.style.display = "none";
  }


  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "user"
      ? "👤"
      : "🤖";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  message.appendChild(
    avatar
  );

  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  chat.scrollTop =
    chat.scrollHeight;


  return bubble;

}


/* =========================
   SEND
========================= */

async function sendMessage() {

  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  input.value = "";


  addMessage(
    message,
    "user"
  );


  const aiBubble =
    addMessage(
      "جاري التفكير...",
      "ai"
    );


  aiBubble.classList.add(
    "typing"
  );


  try {

    const apiUrl =
      getApiUrl();


    console.log(
      "Aizen API:",
      apiUrl
    );


    const response =
      await fetch(
        apiUrl,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message:
                message
            })

        }
      );


    const raw =
      await response.text();


    console.log(
      "Aizen response:",
      raw
    );


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch {

      aiBubble.classList.remove(
        "typing"
      );

      aiBubble.textContent =
        "❌ السيرفر لم يرجع JSON.\n\n" +
        raw.substring(
          0,
          500
        );

      return;

    }


    aiBubble.classList.remove(
      "typing"
    );


    if (!response.ok) {

      aiBubble.textContent =
        "❌ " +
        (
          data.error ||
          "حدث خطأ في Aizen."
        );

      return;

    }


    if (
      data.success === true &&
      data.text
    ) {

      aiBubble.textContent =
        data.text;

    } else {

      aiBubble.textContent =
        "❌ " +
        (
          data.error ||
          "لم يصل أي رد من Aizen."
        );

    }


    chat.scrollTop =
      chat.scrollHeight;


  } catch (error) {

    console.error(
      error
    );


    aiBubble.classList.remove(
      "typing"
    );


    aiBubble.textContent =
      "❌ تعذر الاتصال بـ Aizen.\n\n" +
      "Error: " +
      error.message;

  }

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

  chat.innerHTML = `

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        🤖
      </div>

      <h1>Aizen AI</h1>

      <p>
        اسأل Aizen عن البرمجة أو بناء المواقع والتطبيقات والبوتات.
      </p>

    </div>

  `;

}


/* =========================
   FILE
========================= */

function fileSelected(file) {

  if (
    file &&
    file.files &&
    file.files[0]
  ) {

    addMessage(
      "📎 تم اختيار الملف: " +
      file.files[0].name,
      "user"
    );

  }

}


/* =========================
   BUILD
========================= */

function buildProject() {

  const idea =
    prompt(
      "ماذا تريد أن أبني لك؟"
    );


  if (!idea) {
    return;
  }


  input.value =
    "أريد بناء مشروع: " +
    idea;


  sendMessage();

}

</script>

</body>
</html>
