<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aizen AI Builder</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d12;
  color:#f4f4f5;
  font-family:Arial,Tahoma,sans-serif;
  height:100vh;
  overflow:hidden
}

button,input,textarea{font-family:inherit}

.app{
  height:100vh;
  display:flex;
  flex-direction:column
}

/* HEADER */

header{
  height:64px;
  min-height:64px;
  border-bottom:1px solid #242730;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#0d0f14;
  z-index:20
}

.header-right,
.header-left{
  display:flex;
  align-items:center;
  gap:9px
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:bold
}

.logo,.welcome-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5)
}

.logo{
  width:34px;
  height:34px;
  border-radius:10px
}

.header-btn,
.new-chat{
  border:1px solid #30333d;
  background:#151821;
  color:#ddd;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer
}

.header-btn{
  display:none
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  right:0;
  width:285px;
  height:100vh;
  background:#101218;
  border-left:1px solid #292c36;
  z-index:100;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:.2s ease;
  box-shadow:-15px 0 50px rgba(0,0,0,.35)
}

.sidebar.open{
  transform:translateX(0)
}

.sidebar-head{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #292c36
}

.sidebar-title{
  font-weight:bold;
  font-size:17px
}

.close-sidebar{
  border:1px solid #30333d;
  background:#191c24;
  color:#aaa;
  width:36px;
  height:36px;
  border-radius:9px;
  cursor:pointer
}

.sidebar-actions{
  padding:12px;
  display:flex;
  gap:7px
}

.side-action{
  flex:1;
  border:1px solid #30333d;
  background:#191c24;
  color:#ddd;
  padding:10px 7px;
  border-radius:9px;
  cursor:pointer
}

.side-action.active{
  background:#292040;
  border-color:#7657db
}

.search-box{
  margin:0 12px 10px
}

.search-box input{
  width:100%;
  background:#181b23;
  border:1px solid #30333d;
  color:#fff;
  outline:none;
  border-radius:9px;
  padding:10px
}

.sidebar-section{
  padding:7px 12px;
  color:#777b86;
  font-size:12px
}

.conversation-list,
.project-list{
  overflow-y:auto;
  padding:0 8px 10px
}

.conversation-item,
.project-item{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd;
  text-align:right;
  padding:11px 10px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:2px;
  display:flex;
  align-items:center;
  gap:9px
}

.conversation-item:hover,
.project-item:hover{
  background:#1b1e27
}

.conversation-item.active{
  background:#25202f
}

.item-text{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  flex:1
}

.item-delete{
  opacity:0;
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer
}

.conversation-item:hover .item-delete{
  opacity:1
}

.sidebar-empty{
  color:#666b76;
  text-align:center;
  padding:25px 10px;
  font-size:13px
}

/* MAIN */

.main-layout{
  flex:1;
  min-height:0;
  position:relative
}

main{
  height:100%;
  overflow-y:auto;
  padding:25px 15px 155px
}

.chat{
  width:min(900px,100%);
  margin:auto
}

.welcome{
  text-align:center;
  padding:70px 10px 40px
}

.welcome-logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:20px;
  font-size:30px;
  box-shadow:0 10px 40px rgba(90,70,255,.25)
}

.welcome h1{
  margin:20px 0 8px;
  font-size:30px
}

.welcome p{
  color:#9699a3;
  margin:0
}

/* MESSAGES */

.message{
  display:flex;
  gap:12px;
  margin:25px 0;
  line-height:1.75
}

.message.user{
  flex-direction:row-reverse
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20232d
}

.message.ai .avatar{
  background:linear-gradient(135deg,#8b5cf6,#4f46e5)
}

.bubble{
  max-width:82%;
  padding:12px 16px;
  border-radius:15px;
  white-space:pre-wrap;
  word-break:break-word
}

.message.user .bubble{
  background:#272a34
}

.message.ai .bubble{
  background:#151820;
  border:1px solid #242731
}

.message.ai .bubble code{
  direction:ltr;
  text-align:left
}

.code-block{
  direction:ltr;
  text-align:left;
  background:#090b10;
  border:1px solid #30333d;
  border-radius:10px;
  margin:10px 0;
  overflow:auto;
  white-space:pre
}

.code-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#151820;
  padding:7px 10px;
  color:#858996;
  font-size:11px
}

.copy-code{
  border:1px solid #30333d;
  background:#20232c;
  color:#ddd;
  padding:5px 8px;
  border-radius:6px;
  cursor:pointer
}

.code-content{
  padding:12px;
  font-family:monospace;
  font-size:13px;
  overflow:auto
}

/* THINKING */

.thinking{
  color:#9296a2;
  display:flex;
  align-items:center;
  gap:8px
}

.dots{
  display:inline-flex;
  gap:3px
}

.dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#9b9da5;
  animation:blink 1.2s infinite
}

.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

@keyframes blink{
  0%,70%,100%{opacity:.25}
  35%{opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:15px;
  background:linear-gradient(transparent,#0b0d12 25%);
  z-index:10
}

.composer{
  width:min(900px,100%);
  margin:auto;
  background:#151820;
  border:1px solid #30333e;
  border-radius:17px;
  padding:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.3)
}

textarea{
  width:100%;
  resize:none;
  min-height:48px;
  max-height:180px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  font-family:inherit;
  padding:10px
}

textarea::placeholder{
  color:#777b86
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:5px
}

.left-buttons,
.right-buttons{
  display:flex;
  gap:7px;
  align-items:center
}

.icon-btn,
.build-btn,
.send-btn{
  border:1px solid #30333e;
  background:#1c1f28;
  color:#ddd;
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer
}

.build-btn{
  background:#29204a;
  border-color:#5c43a8;
  color:#d9ceff
}

.build-btn.used{
  background:#171922;
  border-color:#292c35;
  color:#686c77
}

.send-btn{
  width:42px;
  height:38px;
  padding:0;
  font-size:18px;
  background:#eee;
  color:#111
}

.send-btn:disabled,
.build-btn:disabled{
  opacity:.4;
  cursor:not-allowed
}

.status{
  width:min(900px,100%);
  margin:7px auto 0;
  text-align:center;
  font-size:11px;
  color:#686c77
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000
}

.modal-overlay.show{
  display:flex
}

.build-modal,
.projects-modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#12151c;
  border:1px solid #30333e;
  border-radius:20px;
  padding:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  animation:modalIn .18s ease
}

@keyframes modalIn{
  from{transform:translateY(15px) scale(.97);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.modal-title{
  font-size:22px;
  font-weight:bold
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:9px;
  border:1px solid #30333e;
  background:#1b1e27;
  color:#aaa;
  cursor:pointer;
  font-size:18px
}

.build-subtitle{
  color:#8e929e;
  font-size:14px;
  margin-bottom:18px
}

/* BUILD TYPES */

.project-types{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.project-type{
  border:1px solid #30333e;
  background:#191c24;
  color:white;
  border-radius:13px;
  padding:16px;
  text-align:right;
  cursor:pointer;
  transition:.15s
}

.project-type:hover{
  border-color:#7657db;
  background:#211d31;
  transform:translateY(-1px)
}

.project-type.selected{
  border-color:#8b5cf6;
  background:#282040;
  box-shadow:0 0 0 1px #8b5cf6
}

.type-icon{
  font-size:27px;
  margin-bottom:8px
}

.type-name{
  font-size:16px;
  font-weight:bold
}

.type-description{
  color:#888c98;
  font-size:12px;
  margin-top:4px
}

.project-description{
  display:none;
  margin-top:18px
}

.project-description.show{
  display:block
}

.project-description label{
  display:block;
  margin-bottom:8px;
  color:#ddd;
  font-size:14px
}

.project-description textarea{
  min-height:110px;
  max-height:200px;
  width:100%;
  background:#0d1016;
  border:1px solid #30333e;
  border-radius:12px;
  padding:13px;
  resize:vertical
}

.start-build{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer
}

.start-build:disabled{
  opacity:.45;
  cursor:not-allowed
}

/* PROJECTS */

.project-card{
  border:1px solid #30333d;
  background:#191c24;
  padding:14px;
  border-radius:12px;
  margin-bottom:9px
}

.project-card-title{
  font-weight:bold;
  margin-bottom:6px
}

.project-card-type{
  color:#8c91a0;
  font-size:12px
}

/* OVERLAY SIDEBAR */

.sidebar-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90
}

.sidebar-overlay.show{
  display:block
}

@media(max-width:700px){

  .brand span{
    display:none
  }

  .header-btn{
    display:block
  }

  .new-chat{
    font-size:12px;
    padding:8px
  }

  .project-types{
    grid-template-columns:1fr
  }

  .build-modal,
  .projects-modal{
    padding:17px
  }

  .welcome{
    padding-top:45px
  }

  .welcome h1{
    font-size:25px
  }

  .bubble{
    max-width:88%
  }

  .composer-wrap{
    padding:10px
  }

  .sidebar{
    width:88%;
    max-width:320px
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-right">

    <button
      class="header-btn"
      onclick="toggleSidebar()"
    >
      ☰
    </button>

    <div class="brand">
      <div class="logo">🤖</div>
      <span>Aizen AI</span>
    </div>

  </div>

  <button
    class="new-chat"
    onclick="newChat()"
  >
    ＋ محادثة جديدة
  </button>

</header>

<div
  id="sidebarOverlay"
  class="sidebar-overlay"
  onclick="closeSidebar()"
></div>

<!-- SIDEBAR -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-head">

    <div class="sidebar-title">
      Aizen
    </div>

    <button
      class="close-sidebar"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>

  <div class="sidebar-actions">

    <button
      id="chatTab"
      class="side-action active"
      onclick="showSidebarTab('chats')"
    >
      💬 المحادثات
    </button>

    <button
      id="projectTab"
      class="side-action"
      onclick="showSidebarTab('projects')"
    >
      📁 المشاريع
    </button>

  </div>

  <div
    id="chatSidebar"
  >

    <div class="search-box">

      <input
        id="searchInput"
        placeholder="🔎 بحث في المحادثات..."
        oninput="renderConversations()"
      >

    </div>

    <div class="sidebar-section">
      المحادثات
    </div>

    <div
      id="conversationList"
      class="conversation-list"
    ></div>

  </div>

  <div
    id="projectSidebar"
    style="display:none"
  >

    <div class="sidebar-section">
      مشاريعك
    </div>

    <div
      id="projectList"
      class="project-list"
    ></div>

  </div>

</aside>


<div class="main-layout">

<main id="main">

  <div
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        🤖
      </div>

      <h1>
        مرحباً بك في Aizen AI
      </h1>

      <p>
        ابنِ المواقع والتطبيقات والبوتات بمساعدة الذكاء الاصطناعي.
      </p>

    </div>

  </div>

</main>

</div>


<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <textarea
      id="messageInput"
      placeholder="اسأل Aizen أي شيء..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>

    <div class="composer-bottom">

      <div class="left-buttons">

        <button
          class="icon-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          ＋
        </button>

        <input
          id="fileInput"
          type="file"
          style="display:none"
          onchange="fileSelected(this)"
        >

      </div>

      <div class="right-buttons">

        <button
          id="buildBtn"
          class="build-btn"
          onclick="openBuildModal()"
        >
          🛠️ Build
        </button>

        <button
          id="sendBtn"
          class="send-btn"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>

  </div>

  <div class="status">
    Aizen AI يمكن أن يخطئ. تحقق من المعلومات المهمة.
  </div>

</div>

</div>


<!-- BUILD MODAL -->

<div
  id="buildModal"
  class="modal-overlay"
  onclick="closeBuildOnOverlay(event)"
>

<div class="build-modal">

  <div class="modal-header">

    <div class="modal-title">
      🛠️ ماذا تريد أن تبني؟
    </div>

    <button
      class="close-btn"
      onclick="closeBuildModal()"
    >
      ×
    </button>

  </div>

  <div class="build-subtitle">
    اختر نوع المشروع الذي تريد من Aizen AI بناءه.
  </div>

  <div class="project-types">

    <button
      class="project-type"
      onclick="selectProjectType('موقع',this)"
    >
      <div class="type-icon">🌐</div>
      <div class="type-name">موقع</div>
      <div class="type-description">
        مواقع وصفحات ويب حديثة
      </div>
    </button>

    <button
      class="project-type"
      onclick="selectProjectType('تطبيق',this)"
    >
      <div class="type-icon">📱</div>
      <div class="type-name">تطبيق</div>
      <div class="type-description">
        تطبيقات الهاتف والويب
      </div>
    </button>

    <button
      class="project-type"
      onclick="selectProjectType('بوت',this)"
    >
      <div class="type-icon">🤖</div>
      <div class="type-name">بوت</div>
      <div class="type-description">
        Telegram و Discord وغيرها
      </div>
    </button>

    <button
      class="project-type"
      onclick="selectProjectType('لعبة',this)"
    >
      <div class="type-icon">🎮</div>
      <div class="type-name">لعبة</div>
      <div class="type-description">
        ألعاب ومشاريع تفاعلية
      </div>
    </button>

    <button
      class="project-type"
      onclick="selectProjectType('مشروع مخصص',this)"
    >
      <div class="type-icon">⚙️</div>
      <div class="type-name">مشروع مخصص</div>
      <div class="type-description">
        أي فكرة أخرى
      </div>
    </button>

  </div>

  <div
    id="projectDescription"
    class="project-description"
  >

    <label>
      اشرح لـ Aizen ماذا تريد أن يبني:
    </label>

    <textarea
      id="buildDescription"
      placeholder="مثال: أريد موقع متجر إلكتروني فيه تسجيل دخول، منتجات، سلة شراء وصفحة دفع..."
      oninput="updateBuildButton()"
    ></textarea>

    <button
      id="startBuildBtn"
      class="start-build"
      disabled
      onclick="startBuild()"
    >
      🚀 ابدأ بناء المشروع
    </button>

  </div>

</div>

</div>


<!-- PROJECTS MODAL -->

<div
  id="projectsModal"
  class="modal-overlay"
  onclick="closeProjectsOnOverlay(event)"
>

<div class="projects-modal">

  <div class="modal-header">

    <div class="modal-title">
      📁 المشاريع
    </div>

    <button
      class="close-btn"
      onclick="closeProjectsModal()"
    >
      ×
    </button>

  </div>

  <div
    id="projectsModalList"
  ></div>

</div>

</div>


<script>

const RENDER_URL =
  "https://aizen-ai-builder.onrender.com";

let isGenerating = false;
let selectedProjectType = "";
let currentChatId = null;
let buildUsed = false;

let conversations =
  JSON.parse(
    localStorage.getItem(
      "aizen_conversations"
    ) || "[]"
  );

let projects =
  JSON.parse(
    localStorage.getItem(
      "aizen_projects"
    ) || "[]"
  );


function saveData(){

  localStorage.setItem(
    "aizen_conversations",
    JSON.stringify(conversations)
  );

  localStorage.setItem(
    "aizen_projects",
    JSON.stringify(projects)
  );
}


/* API */

function getApiUrl(){

  if(
    window.location.hostname ===
    "aizen-ai-builder.onrender.com"
  ){
    return "/api/chat";
  }

  return RENDER_URL + "/api/chat";
}


/* CHAT ID */

function createChatId(){

  return "chat_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);
}


/* CHAT TITLE */

function makeTitle(text){

  let title =
    text
      .replace(/\s+/g," ")
      .trim();

  if(title.length > 35)
    title =
      title.slice(0,35) + "...";

  return title || "محادثة جديدة";
}


/* CURRENT CHAT */

function ensureChat(){

  if(currentChatId)
    return;

  currentChatId =
    createChatId();

  conversations.unshift({

    id:currentChatId,
    title:"محادثة جديدة",
    messages:[],
    buildUsed:false,
    createdAt:Date.now()

  });

  saveData();

  renderConversations();
}


function getCurrentChat(){

  return conversations.find(
    c => c.id === currentChatId
  );
}


/* SIDEBAR */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

  document
    .getElementById("sidebarOverlay")
    .classList.toggle("show");
}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

  document
    .getElementById("sidebarOverlay")
    .classList.remove("show");
}


function showSidebarTab(tab){

  const chats =
    tab === "chats";

  document
    .getElementById("chatSidebar")
    .style.display =
      chats ? "block" : "none";

  document
    .getElementById("projectSidebar")
    .style.display =
      chats ? "none" : "block";

  document
    .getElementById("chatTab")
    .classList.toggle(
      "active",
      chats
    );

  document
    .getElementById("projectTab")
    .classList.toggle(
      "active",
      !chats
    );

  if(!chats)
    renderProjects();
}


/* CONVERSATIONS */

function renderConversations(){

  const list =
    document.getElementById(
      "conversationList"
    );

  const search =
    (
      document.getElementById(
        "searchInput"
      ).value || ""
    )
      .toLowerCase()
      .trim();

  const filtered =
    conversations.filter(c =>
      c.title
        .toLowerCase()
        .includes(search)
    );

  list.innerHTML = "";

  if(!filtered.length){

    list.innerHTML =
      `<div class="sidebar-empty">
        لا توجد محادثات
      </div>`;

    return;
  }

  filtered.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "conversation-item" +
      (
        chat.id === currentChatId
          ? " active"
          : ""
      );

    const text =
      document.createElement("div");

    text.className =
      "item-text";

    text.textContent =
      chat.title;

    const deleteBtn =
      document.createElement("button");

    deleteBtn.className =
      "item-delete";

    deleteBtn.textContent =
      "×";

    deleteBtn.onclick =
      event => {

        event.stopPropagation();

        deleteConversation(
          chat.id
        );
      };

    item.onclick =
      () => {

        loadConversation(
          chat.id
        );

        closeSidebar();
      };

    item.appendChild(text);
    item.appendChild(deleteBtn);

    list.appendChild(item);

  });
}


function deleteConversation(id){

  const chat =
    conversations.find(
      c => c.id === id
    );

  if(!chat)
    return;

  if(
    !confirm(
      "هل تريد حذف هذه المحادثة؟"
    )
  )
    return;

  conversations =
    conversations.filter(
      c => c.id !== id
    );

  if(currentChatId === id){

    currentChatId = null;

    newChat();

  }

  saveData();

  renderConversations();
}


function loadConversation(id){

  const conversation =
    conversations.find(
      c => c.id === id
    );

  if(!conversation)
    return;

  currentChatId =
    conversation.id;

  buildUsed =
    !!conversation.buildUsed;

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if(
    !conversation.messages.length
  ){

    showWelcome();

  }else{

    conversation.messages.forEach(
      message => {

        if(
          message.type === "user"
        ){

          addMessage(
            "user",
            message.text,
            false
          );

        }else{

          addMessage(
            "ai",
            message.text,
            false
          );

        }

      }
    );

  }

  updateBuildState();

  renderConversations();

  document
    .getElementById("main")
    .scrollTop = 999999;
}


/* WELCOME */

function showWelcome(){

  document
    .getElementById("chat")
    .innerHTML = `
      <div
        class="welcome"
        id="welcome"
      >
        <div class="welcome-logo">
          🤖
        </div>

        <h1>
          مرحباً بك في Aizen AI
        </h1>

        <p>
          ابنِ المواقع والتطبيقات والبوتات بمساعدة الذكاء الاصطناعي.
        </p>
      </div>
    `;
}


function removeWelcome(){

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome)
    welcome.remove();
}


/* MESSAGES */

function addMessage(
  type,
  text,
  save = true
){

  removeWelcome();

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "user"
      ? "👤"
      : "🤖";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if(type === "ai"){

    renderAIText(
      bubble,
      text
    );

  }else{

    bubble.textContent =
      text;

  }

  message.appendChild(avatar);
  message.appendChild(bubble);

  chat.appendChild(message);

  scrollToBottom();

  if(
    save &&
    currentChatId
  ){

    const current =
      getCurrentChat();

    if(current){

      current.messages.push({
        type,
        text
      });

      if(
        type === "user" &&
        current.title ===
        "محادثة جديدة"
      ){

        current.title =
          makeTitle(text);

      }

      saveData();
      renderConversations();

    }

  }

  return bubble;
}


/* AI TEXT / CODE */

function renderAIText(
  element,
  text
){

  const parts =
    text.split(
      /(```[\s\S]*?```)/g
    );

  element.innerHTML = "";

  parts.forEach(part => {

    if(
      part.startsWith("```")
    ){

      const firstLineEnd =
        part.indexOf("\n");

      let language =
        "code";

      let code = "";

      if(firstLineEnd !== -1){

        language =
          part
            .slice(3,firstLineEnd)
            .trim() ||
          "code";

        code =
          part
            .slice(firstLineEnd + 1)
            .replace(/```$/,"");

      }else{

        code =
          part
            .slice(3)
            .replace(/```$/,"");

      }

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "code-block";

      const head =
        document.createElement("div");

      head.className =
        "code-head";

      const lang =
        document.createElement("span");

      lang.textContent =
        language;

      const copy =
        document.createElement("button");

      copy.className =
        "copy-code";

      copy.textContent =
        "نسخ";

      copy.onclick =
        async () => {

          try{

            await navigator.clipboard
              .writeText(code);

            copy.textContent =
              "تم النسخ ✓";

            setTimeout(
              () =>
                copy.textContent =
                  "نسخ",
              1500
            );

          }catch{}

        };

      head.appendChild(lang);
      head.appendChild(copy);

      const content =
        document.createElement("div");

      content.className =
        "code-content";

      content.textContent =
        code;

      wrapper.appendChild(head);
      wrapper.appendChild(content);

      element.appendChild(wrapper);

    }else{

      if(part){

        const textNode =
          document.createElement("div");

        textNode.textContent =
          part;

        element.appendChild(
          textNode
        );

      }

    }

  });
}


/* THINKING */

function addThinking(){

  removeWelcome();

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "thinkingMessage";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    "🤖";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble thinking";

  bubble.innerHTML = `
    جاري التفكير
    <span class="dots">
      <span></span>
      <span></span>
      <span></span>
    </span>
  `;

  message.appendChild(avatar);
  message.appendChild(bubble);

  chat.appendChild(message);

  scrollToBottom();

  return message;
}


function replaceThinkingWithStream(){

  const thinking =
    document.getElementById(
      "thinkingMessage"
    );

  if(!thinking)
    return addMessage(
      "ai",
      "",
      false
    );

  const bubble =
    thinking.querySelector(
      ".bubble"
    );

  bubble.className =
    "bubble";

  bubble.innerHTML = "";

  return bubble;
}


/* STREAMING */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}


function autoResize(element){

  element.style.height =
    "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) + "px";
}


function setGenerating(value){

  isGenerating =
    value;

  document.getElementById(
    "sendBtn"
  ).disabled =
    value;

  updateBuildState();

  document.getElementById(
    "sendBtn"
  ).textContent =
    value ? "…" : "↑";
}


async function sendMessage(
  customMessage = null
){

  if(isGenerating)
    return;

  ensureChat();

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    customMessage !== null
      ? customMessage.trim()
      : input.value.trim();

  if(!message)
    return;

  if(customMessage === null){

    input.value = "";

    input.style.height =
      "auto";

  }

  addMessage(
    "user",
    message
  );

  addThinking();

  setGenerating(true);

  try{

    const response =
      await fetch(
        getApiUrl(),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            message
          })
        }
      );

    if(!response.ok){

      const errorText =
        await response.text();

      let errorMessage =
        errorText;

      try{

        const json =
          JSON.parse(
            errorText
          );

        errorMessage =
          json.error ||
          json.message ||
          errorText;

      }catch{}

      throw new Error(
        errorMessage ||
        "حدث خطأ في السيرفر"
      );
    }

    if(!response.body)
      throw new Error(
        "المتصفح لا يدعم Streaming."
      );

    const aiBubble =
      replaceThinkingWithStream();

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let buffer = "";
    let fullText = "";
    let receivedText = false;

    while(true){

      const result =
        await reader.read();

      if(result.done)
        break;

      buffer +=
        decoder.decode(
          result.value,
          {stream:true}
        );

      const events =
        buffer.split("\n\n");

      buffer =
        events.pop() || "";

      for(
        const eventBlock of events
      ){

        processStreamEvent(
          eventBlock,
          aiBubble,
          chunk => {

            receivedText = true;
            fullText += chunk;

          }
        );

      }

      scrollToBottom();

    }

    if(buffer.trim()){

      processStreamEvent(
        buffer,
        aiBubble,
        chunk => {

          receivedText = true;
          fullText += chunk;

        }
      );

    }

    if(!receivedText){

      aiBubble.textContent =
        "❌ لم يصل أي نص من Aizen.";

      fullText =
        "❌ لم يصل أي نص من Aizen.";

    }

    const current =
      getCurrentChat();

    if(current){

      current.messages.push({
        type:"ai",
        text:fullText
      });

      saveData();

    }

  }catch(error){

    console.error(error);

    const thinking =
      document.getElementById(
        "thinkingMessage"
      );

    if(thinking){

      const bubble =
        thinking.querySelector(
          ".bubble"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        "❌ حدث خطأ:\n" +
        error.message;

    }

  }finally{

    setGenerating(false);

    scrollToBottom();

  }
}


function processStreamEvent(
  eventBlock,
  bubble,
  onText
){

  if(!eventBlock)
    return;

  const lines =
    eventBlock.split("\n");

  let eventType = "";
  let dataText = "";

  for(
    const line of lines
  ){

    if(
      line.startsWith("event:")
    ){

      eventType =
        line.slice(6).trim();

    }

    if(
      line.startsWith("data:")
    ){

      dataText +=
        line.slice(5).trim();

    }

  }

  if(!dataText)
    return;

  try{

    const data =
      JSON.parse(dataText);

    if(
      eventType === "text" &&
      data.text
    ){

      bubble.textContent +=
        data.text;

      onText(data.text);

      scrollToBottom();

      return;

    }

    if(
      eventType === "error"
    ){

      const errorText =
        "❌ " +
        (
          data.error ||
          "حدث خطأ أثناء التوليد"
        );

      bubble.textContent =
        errorText;

      onText(errorText);

    }

  }catch(error){

    console.error(
      "Stream event error:",
      error
    );

  }
}


/* BUILD */

function updateBuildState(){

  const button =
    document.getElementById(
      "buildBtn"
    );

  if(buildUsed){

    button.disabled = true;
    button.classList.add("used");
    button.textContent =
      "✓ تم استخدام Build";

  }else{

    button.disabled =
      isGenerating;

    button.classList.remove("used");
    button.textContent =
      "🛠️ Build";

  }
}


function openBuildModal(){

  if(isGenerating)
    return;

  if(buildUsed)
    return;

  document
    .getElementById("buildModal")
    .classList.add("show");
}


function closeBuildModal(){

  document
    .getElementById("buildModal")
    .classList.remove("show");
}


function closeBuildOnOverlay(event){

  if(
    event.target.id ===
    "buildModal"
  ){

    closeBuildModal();

  }
}


function selectProjectType(
  type,
  element
){

  selectedProjectType =
    type;

  document
    .querySelectorAll(
      ".project-type"
    )
    .forEach(
      button =>
        button.classList.remove(
          "selected"
        )
    );

  element.classList.add(
    "selected"
  );

  document
    .getElementById(
      "projectDescription"
    )
    .classList.add(
      "show"
    );

  document
    .getElementById(
      "buildDescription"
    )
    .focus();

  updateBuildButton();

}


function updateBuildButton(){

  const description =
    document
      .getElementById(
        "buildDescription"
      )
      .value
      .trim();

  document
    .getElementById(
      "startBuildBtn"
    ).disabled =
      !selectedProjectType ||
      !description ||
      buildUsed;

}


function startBuild(){

  if(buildUsed)
    return;

  if(!selectedProjectType)
    return;

  const description =
    document
      .getElementById(
        "buildDescription"
      )
      .value
      .trim();

  if(!description)
    return;

  ensureChat();

  const prompt =
`أريد بناء مشروع من نوع: ${selectedProjectType}

وصف المشروع:
${description}

تعامل مع هذا الطلب كمشروع حقيقي داخل Aizen AI Builder.
حلل الفكرة، حدد البنية والواجهة والوظائف والتقنيات المناسبة، وابدأ بتنفيذ المشروع عمليًا.
إذا احتجت إلى كود، ضعه داخل Code Block واضح.
لا تطرح أسئلة إلا إذا كانت ضرورية جدًا.`;

  buildUsed = true;

  const current =
    getCurrentChat();

  if(current){

    current.buildUsed =
      true;

    current.projectType =
      selectedProjectType;

    current.projectDescription =
      description;

    current.title =
      "🛠️ " +
      makeTitle(
        description
      );

    saveData();

  }

  updateBuildState();

  createProjectRecord(
    selectedProjectType,
    description
  );

  closeBuildModal();

  document
    .getElementById(
      "buildDescription"
    ).value = "";

  selectedProjectType = "";

  document
    .querySelectorAll(
      ".project-type"
    )
    .forEach(
      button =>
        button.classList.remove(
          "selected"
        )
    );

  document
    .getElementById(
      "projectDescription"
    )
    .classList.remove(
      "show"
    );

  updateBuildButton();

  sendMessage(prompt);

}


/* PROJECTS */

function createProjectRecord(
  type,
  description
){

  const current =
    getCurrentChat();

  const project = {

    id:
      "project_" +
      Date.now(),

    name:
      makeTitle(
        description
      ),

    type,

    description,

    chatId:
      currentChatId,

    createdAt:
      Date.now()

  };

  projects.unshift(
    project
  );

  saveData();

  renderProjects();

}


function renderProjects(){

  const list =
    document.getElementById(
      "projectList"
    );

  list.innerHTML = "";

  if(!projects.length){

    list.innerHTML =
      `<div class="sidebar-empty">
        لا توجد مشاريع حتى الآن
      </div>`;

    return;

  }

  projects.forEach(project => {

    const item =
      document.createElement("button");

    item.className =
      "project-item";

    item.onclick =
      () => {

        if(project.chatId){

          loadConversation(
            project.chatId
          );

          closeSidebar();

        }

      };

    item.innerHTML =
      `
      <span>📁</span>
      <span class="item-text">
        ${escapeHTML(project.name)}
      </span>
      `;

    list.appendChild(item);

  });

  renderProjectsModal();

}


function renderProjectsModal(){

  const list =
    document.getElementById(
      "projectsModalList"
    );

  if(!list)
    return;

  list.innerHTML = "";

  if(!projects.length){

    list.innerHTML =
      `<div class="sidebar-empty">
        لا توجد مشاريع حتى الآن.
      </div>`;

    return;

  }

  projects.forEach(project => {

    const card =
      document.createElement("div");

    card.className =
      "project-card";

    card.innerHTML =
      `
      <div class="project-card-title">
        📁 ${escapeHTML(project.name)}
      </div>

      <div class="project-card-type">
        النوع: ${escapeHTML(project.type)}
      </div>

      <div
        style="color:#999;font-size:12px;margin-top:7px"
      >
        ${escapeHTML(project.description)}
      </div>

      <button
        style="
          margin-top:10px;
          border:1px solid #30333d;
          background:#20232c;
          color:#ddd;
          padding:8px 10px;
          border-radius:8px;
          cursor:pointer
        "
        onclick="openProjectChat('${project.chatId}')"
      >
        💬 فتح المحادثة
      </button>
      `;

    list.appendChild(card);

  });

}


function openProjectsModal(){

  renderProjectsModal();

  document
    .getElementById(
      "projectsModal"
    )
    .classList.add("show");

}


function closeProjectsModal(){

  document
    .getElementById(
      "projectsModal"
    )
    .classList.remove("show");

}


function closeProjectsOnOverlay(event){

  if(
    event.target.id ===
    "projectsModal"
  ){

    closeProjectsModal();

  }

}


function openProjectChat(chatId){

  if(!chatId)
    return;

  loadConversation(chatId);

  closeProjectsModal();
  closeSidebar();

}


/* NEW CHAT */

function newChat(){

  if(isGenerating)
    return;

  currentChatId =
    createChatId();

  buildUsed = false;

  conversations.unshift({

    id:
      currentChatId,

    title:
      "محادثة جديدة",

    messages:[],

    buildUsed:false,

    createdAt:
      Date.now()

  });

  saveData();

  showWelcome();

  document
    .getElementById(
      "messageInput"
    ).value = "";

  document
    .getElementById(
      "messageInput"
    ).style.height =
      "auto";

  updateBuildState();

  renderConversations();

  closeSidebar();

}


/* FILE */

function fileSelected(input){

  if(!input.files.length)
    return;

  const file =
    input.files[0];

  const inputBox =
    document.getElementById(
      "messageInput"
    );

  inputBox.value =
    `📎 الملف المحدد: ${file.name}\n\nاكتب ماذا تريد من Aizen أن يفعل بهذا الملف.`;

  inputBox.focus();

  input.value = "";

}


/* UTILS */

function scrollToBottom(){

  const main =
    document.getElementById(
      "main"
    );

  setTimeout(
    () => {
      main.scrollTop =
        main.scrollHeight;
    },
    20
  );

}


function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* INIT */

function init(){

  if(conversations.length){

    loadConversation(
      conversations[0].id
    );

  }else{

    newChat();

  }

  renderConversations();
  renderProjects();

  updateBuildState();

}

init();

</script>
