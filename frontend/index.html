<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aizen AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      min-height: 60px;
      border-bottom: 1px solid #20242d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #0b0d12;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-chat {
      border: 1px solid #292e39;
      background: #151820;
      color: #ddd;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 15px 150px;
      scroll-behavior: smooth;
    }

    .messages {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .welcome p {
      margin: 0;
      color: #858b98;
      font-size: 15px;
    }

    .message {
      display: flex;
      margin: 22px 0;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user .avatar {
      background: #252a35;
    }

    .ai .avatar {
      background: #7c3aed;
    }

    .bubble {
      max-width: calc(100% - 50px);
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #1b1f27;
      padding: 11px 15px;
      border-radius: 16px;
    }

    .ai .bubble {
      padding-top: 4px;
    }

    .typing {
      color: #8b93a3;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 17px;
      background: #8b5cf6;
      margin-right: 3px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(
        to top,
        #0b0d12 70%,
        transparent
      );
      padding: 20px 15px 18px;
    }

    .composer {
      width: 100%;
      max-width: 850px;
      margin: auto;
      background: #151820;
      border: 1px solid #2a2f39;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .textarea-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      padding: 10px;
    }

    textarea::placeholder {
      color: #727887;
    }

    .icon-button,
    .send-button {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button {
      background: transparent;
      color: #9ca3af;
      font-size: 20px;
    }

    .icon-button:hover {
      background: #222631;
    }

    .send-button {
      background: #7c3aed;
      color: white;
      font-size: 18px;
    }

    .send-button:hover {
      background: #6d28d9;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 4px 0;
    }

    .build-button {
      background: transparent;
      border: 1px solid #292e39;
      color: #aeb4c0;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .build-button:hover {
      background: #20242d;
      color: white;
    }

    .disclaimer {
      text-align: center;
      color: #626875;
      font-size: 11px;
      margin-top: 8px;
    }

    #fileInput {
      display: none;
    }

    @media (max-width: 600px) {

      .header {
        padding: 0 12px;
      }

      .chat {
        padding-top: 20px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .bubble {
        font-size: 14px;
      }

      .bottom {
        padding: 12px 10px;
      }

      .new-chat {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="logo">🤖</div>
      <span>Aizen AI</span>
    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ محادثة جديدة
    </button>

  </header>


  <main
    class="chat"
    id="chat"
  >

    <div
      class="messages"
      id="messages"
    >

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-logo">
          🤖
        </div>

        <h1>كيف يمكنني مساعدتك؟</h1>

        <p>
          تحدث مع Aizen أو اطلب منه بناء مشروعك.
        </p>

      </div>

    </div>

  </main>


  <div class="bottom">

    <div class="composer">

      <div class="textarea-row">

        <input
          type="file"
          id="fileInput"
          onchange="fileSelected()"
        >

        <button
          class="icon-button"
          onclick="openFile()"
          title="إرفاق ملف"
        >
          ＋
        </button>

        <textarea
          id="message"
          rows="1"
          placeholder="اسأل Aizen أي شيء..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>

        <button
          class="send-button"
          id="sendButton"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>


      <div class="tools">

        <button
          class="build-button"
          onclick="buildProject()"
        >
          🛠️ Build
        </button>

      </div>

    </div>


    <div class="disclaimer">
      Aizen AI يمكن أن يخطئ. تحقق من المعلومات المهمة.
    </div>

  </div>

</div>


<script>

let isGenerating = false;


/*
  إضافة رسالة
*/

function addMessage(text, type) {

  const messages =
    document.getElementById("messages");

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "user"
      ? "👤"
      : "🤖";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(avatar);
  message.appendChild(bubble);

  messages.appendChild(message);

  scrollToBottom();

  return bubble;
}


/*
  تمرير لأسفل
*/

function scrollToBottom() {

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;

}


/*
  إرسال الرسالة
*/

async function sendMessage() {

  if (isGenerating) {
    return;
  }

  const input =
    document.getElementById("message");

  const button =
    document.getElementById("sendButton");

  const message =
    input.value.trim();

  if (!message) {
    return;
  }

  isGenerating = true;

  button.disabled = true;

  addMessage(
    message,
    "user"
  );

  input.value = "";

  autoResize(input);


  /*
    إنشاء رسالة AI فارغة
  */

  const aiBubble =
    addMessage(
      "",
      "ai"
    );

  aiBubble.classList.add(
    "typing"
  );

  aiBubble.innerHTML =
    'جاري التفكير<span class="cursor"></span>';


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    /*
      إذا رجع السيرفر خطأ
    */

    if (!response.ok) {

      let errorText =
        "حدث خطأ من السيرفر";

      try {

        const errorData =
          await response.json();

        errorText =
          errorData.error ||
          errorText;

      } catch {}

      aiBubble.classList.remove(
        "typing"
      );

      aiBubble.textContent =
        "❌ " + errorText;

      return;
    }


    /*
      قراءة Streaming
    */

    if (!response.body) {

      throw new Error(
        "المتصفح لا يدعم Streaming"
      );

    }


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let buffer = "";

    let fullText = "";

    let started = false;


    while (true) {

      const {
        value,
        done
      } =
        await reader.read();

      if (done) {
        break;
      }

      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const events =
        buffer.split("\n\n");

      buffer =
        events.pop() || "";


      for (
        const eventBlock
        of events
      ) {

        const lines =
          eventBlock.split("\n");

        let dataLine = "";


        for (
          const line
          of lines
        ) {

          if (
            line.startsWith("data:")
          ) {

            dataLine +=
              line
                .substring(5)
                .trim();

          }

        }


        if (!dataLine) {
          continue;
        }


        try {

          const event =
            JSON.parse(
              dataLine
            );


          /*
            وصول جزء جديد
          */

          if (
            event.type === "text"
          ) {

            if (!started) {

              started = true;

              aiBubble.classList.remove(
                "typing"
              );

              aiBubble.textContent =
                "";

            }

            fullText +=
              event.text;

            aiBubble.textContent =
              fullText;

            scrollToBottom();

          }


          /*
            خطأ
          */

          if (
            event.type === "error"
          ) {

            aiBubble.classList.remove(
              "typing"
            );

            aiBubble.textContent =
              "❌ " +
              event.error;

          }

        } catch (error) {

          console.log(
            "Stream event parse error",
            error
          );

        }

      }

    }


    /*
      إذا انتهى بدون نص
    */

    if (!fullText) {

      aiBubble.classList.remove(
        "typing"
      );

      aiBubble.textContent =
        "❌ لم يصل أي رد من Aizen.";

    }


  } catch (error) {

    console.error(error);

    aiBubble.classList.remove(
      "typing"
    );

    aiBubble.textContent =
      "❌ تعذر الاتصال بالسيرفر.";

  }


  isGenerating = false;

  button.disabled = false;

  input.focus();

  scrollToBottom();

}


/*
  Enter للإرسال
*/

function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


/*
  تكبير مربع الكتابة
*/

function autoResize(element) {

  element.style.height =
    "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) + "px";

}


/*
  محادثة جديدة
*/

function newChat() {

  document.getElementById(
    "messages"
  ).innerHTML = `

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        🤖
      </div>

      <h1>
        كيف يمكنني مساعدتك؟
      </h1>

      <p>
        تحدث مع Aizen أو اطلب منه بناء مشروعك.
      </p>

    </div>

  `;

}


/*
  إرفاق ملف
*/

function openFile() {

  document
    .getElementById("fileInput")
    .click();

}


function fileSelected() {

  const file =
    document
      .getElementById("fileInput")
      .files[0];

  if (!file) {
    return;
  }

  addMessage(
    "📎 " + file.name,
    "user"
  );

}


/*
  زر Build
*/

function buildProject() {

  const input =
    document.getElementById("message");

  input.value =
    "أريد بناء مشروع: ";

  input.focus();

  autoResize(input);

}

</script>

</body>
</html>
