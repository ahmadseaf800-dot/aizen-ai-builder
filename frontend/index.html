<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aizen AI Builder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  font-family:Arial,"Segoe UI",sans-serif;
  background:#0b0d12;
  color:#f4f5f7;
  overflow:hidden;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#101218;
  border-bottom:1px solid #252832;
  position:relative;
  z-index:30;
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.menu-button,
.header-button{
  width:38px;
  height:38px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#181b22;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
}

.brand-logo{
  width:32px;
  height:32px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c5cff,#4b8cff);
  font-weight:900;
}

.account-name{
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  min-width:280px;
  background:#101218;
  border-left:1px solid #252832;
  display:flex;
  flex-direction:column;
}

.sidebar-top{
  padding:12px;
}

.new-chat-button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:11px;
  background:#6d5dfc;
  color:#fff;
  font-weight:700;
}

.search-box{
  margin-top:10px;
}

.search-box input{
  width:100%;
  padding:10px;
  border:1px solid #30343e;
  border-radius:10px;
  outline:none;
  background:#181b22;
  color:#fff;
}

.sidebar-tabs{
  display:flex;
  gap:5px;
  padding:0 12px 10px;
}

.sidebar-tab{
  flex:1;
  padding:8px 5px;
  border:1px solid #30343e;
  border-radius:9px;
  background:#181b22;
  color:#aeb3bf;
}

.sidebar-tab.active{
  background:#242132;
  color:#fff;
  border-color:#6d5dfc;
}

.sidebar-content{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0 8px 10px;
}

.empty-state{
  padding:25px 10px;
  text-align:center;
  color:#777d89;
  font-size:13px;
}

/* CONVERSATIONS */

.conversation-item{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:4px;
  border-radius:10px;
}

.conversation-item:hover,
.conversation-item.active{
  background:#20242d;
}

.conversation-main{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
  cursor:pointer;
}

.conversation-icon{
  width:30px;
  min-width:30px;
  height:30px;
  border-radius:8px;
  background:#181b22;
  display:flex;
  align-items:center;
  justify-content:center;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.conversation-date{
  margin-top:3px;
  color:#777d89;
  font-size:10px;
}

.conversation-menu{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#888e9a;
}

/* PROJECTS */

.project-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.project-item{
  padding:11px;
  border:1px solid #2a2e38;
  border-radius:10px;
  background:#15181f;
}

.project-name{
  font-size:13px;
  font-weight:700;
}

.project-type{
  margin-top:4px;
  color:#858b97;
  font-size:10px;
}

.project-actions{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.project-actions button{
  flex:1;
  padding:6px;
  border:1px solid #30343e;
  border-radius:7px;
  background:#1b1e26;
  color:#fff;
  font-size:11px;
}

/* CHAT */

.chat-area{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:24px 16px 160px;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.welcome-logo{
  width:65px;
  height:65px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c5cff,#4b8cff);
  font-size:30px;
  font-weight:900;
  margin-bottom:18px;
}

.welcome h1{
  margin:0;
  font-size:24px;
}

.welcome p{
  color:#8c929e;
  font-size:14px;
}

/* MESSAGE */

.message{
  width:min(900px,100%);
  margin:0 auto 18px;
  display:flex;
  gap:10px;
}

.message.user{
  flex-direction:row-reverse;
}

.message-avatar{
  width:34px;
  min-width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20242d;
  font-size:12px;
  font-weight:700;
}

.message.user .message-avatar{
  background:#6d5dfc;
}

.message-content{
  max-width:calc(100% - 45px);
  padding:11px 13px;
  border-radius:13px;
  background:#15181f;
  border:1px solid #282c35;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.55;
  font-size:14px;
}

.message.user .message-content{
  background:#28224d;
  border-color:#40377a;
}

/* COMPOSER */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px 15px 16px;
  background:linear-gradient(to top,#0b0d12 70%,transparent);
  pointer-events:none;
}

.composer{
  width:min(900px,100%);
  margin:auto;
  padding:8px;
  border:1px solid #343844;
  border-radius:15px;
  background:#15181f;
  pointer-events:auto;
}

.composer textarea{
  width:100%;
  min-height:45px;
  max-height:180px;
  resize:none;
  padding:10px;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  line-height:1.5;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.composer-actions{
  display:flex;
  gap:6px;
}

.composer-button,
.send-button,
.stop-button{
  width:38px;
  height:38px;
  border-radius:9px;
}

.composer-button{
  border:1px solid #30343e;
  background:#1b1e26;
  color:#fff;
}

.send-button{
  border:0;
  background:#6d5dfc;
  color:#fff;
}

.stop-button{
  display:none;
  border:0;
  background:#a83d4b;
  color:#fff;
}

.build-button{
  padding:8px 13px;
  border:1px solid #5148a0;
  border-radius:9px;
  background:#28224d;
  color:#fff;
  font-weight:700;
}

/* AUTH */

.auth-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
}

.auth-box{
  width:min(420px,100%);
  padding:25px;
  border:1px solid #30343e;
  border-radius:18px;
  background:#12151c;
}

.auth-box h2{
  margin:0 0 8px;
}

.auth-subtitle{
  color:#858b97;
  font-size:13px;
  margin-bottom:18px;
}

.auth-input{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border:1px solid #30343e;
  border-radius:10px;
  outline:none;
  background:#191c23;
  color:#fff;
}

.auth-primary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#6d5dfc;
  color:#fff;
  font-weight:700;
}

.oauth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.auth-oauth{
  padding:10px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#191c23;
  color:#fff;
}

.auth-link{
  margin-top:12px;
  color:#9b90ff;
  text-align:center;
  cursor:pointer;
  font-size:13px;
}

/* ACCOUNT MENU */

.account-menu{
  position:absolute;
  top:52px;
  left:14px;
  width:190px;
  padding:7px;
  border:1px solid #30343e;
  border-radius:12px;
  background:#15181f;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  z-index:80;
}

.account-menu button{
  width:100%;
  padding:9px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  text-align:right;
}

.account-menu button:hover{
  background:#242832;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
}

.modal-box{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  padding:20px;
  border:1px solid #30343e;
  border-radius:15px;
  background:#12151c;
}

.modal-box h3{
  margin-top:0;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-buttons button{
  flex:1;
  padding:10px;
  border:1px solid #30343e;
  border-radius:9px;
  background:#191c23;
  color:#fff;
}

.primary{
  background:#6d5dfc!important;
  border-color:#6d5dfc!important;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:200;
  padding:11px 16px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#181b22;
  color:#fff;
  display:none;
  max-width:90%;
  text-align:center;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    top:58px;
    bottom:0;
    right:0;
    z-index:50;
    transform:translateX(100%);
    transition:transform .2s;
    box-shadow:-10px 0 35px rgba(0,0,0,.4);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .brand{
    font-size:14px;
  }

  .account-name{
    display:none;
  }

  .messages{
    padding:18px 10px 150px;
  }

  .message-content{
    font-size:13px;
  }

  .welcome h1{
    font-size:20px;
  }

  .composer-wrap{
    padding:8px 8px 10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="header-left">

    <button
      class="menu-button"
      type="button"
      onclick="toggleSidebar()"
    >☰</button>

    <div class="brand">
      <div class="brand-logo">A</div>
      <span>Aizen AI Builder</span>
    </div>

  </div>

  <div class="header-right">

    <span
      id="accountName"
      class="account-name hidden"
    ></span>

    <button
      id="loginButton"
      class="header-button"
      type="button"
      onclick="openAuth()"
    >
      دخول
    </button>

    <button
      id="accountButton"
      class="header-button hidden"
      type="button"
      onclick="toggleAccountMenu()"
    >
      👤
    </button>

  </div>

  <div
    id="accountMenu"
    class="account-menu hidden"
  >
    <button onclick="openProfile()">👤 الحساب</button>
    <button onclick="logout()">🚪 تسجيل الخروج</button>
  </div>

</header>


<main class="main">

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-top">

    <button
      class="new-chat-button"
      onclick="newChat()"
    >
      ＋ محادثة جديدة
    </button>

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="بحث في المحادثات..."
      >

    </div>

  </div>


  <div class="sidebar-tabs">

    <button
      id="chatTab"
      class="sidebar-tab active"
      onclick="showSidebarTab('chats')"
    >
      💬 المحادثات
    </button>

    <button
      id="projectTab"
      class="sidebar-tab"
      onclick="showSidebarTab('projects')"
    >
      📁 المشاريع
    </button>

  </div>


  <div
    id="chatSidebar"
    class="sidebar-content"
  >
    <div id="conversationList"></div>
  </div>


  <div
    id="projectSidebar"
    class="sidebar-content"
    style="display:none"
  >
    <div id="projectList" class="project-list"></div>
  </div>

</aside>


<section class="chat-area">

  <div
    id="messages"
    class="messages"
  >

    <div class="welcome">

      <div class="welcome-logo">A</div>

      <h1>مرحباً بك في Aizen AI Builder</h1>

      <p>
        اكتب فكرتك وسيساعدك Aizen في بناء مشروعك.
      </p>

    </div>

  </div>


  <div class="composer-wrap">

    <div class="composer">

      <textarea
        id="messageInput"
        placeholder="اكتب فكرتك هنا..."
        rows="1"
      ></textarea>


      <div class="composer-bottom">

        <div class="composer-actions">

          <button
            class="composer-button"
            onclick="triggerFileUpload()"
          >
            📎
          </button>

          <button
            id="buildButton"
            class="build-button"
            onclick="startBuild()"
          >
            Build
          </button>

        </div>


        <div>

          <button
            id="stopButton"
            class="stop-button"
            onclick="stopGeneration()"
          >
            ■
          </button>

          <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      Aizen AI جاهز للعمل.
    </div>

  </div>

</section>

</main>
</div>


<input
  id="fileInput"
  type="file"
  multiple
  hidden
>


<!-- AUTH -->

<div
  id="authOverlay"
  class="auth-overlay hidden"
>

  <div class="auth-box">

    <h2 id="authTitle">تسجيل الدخول</h2>

    <div
      id="authSubtitle"
      class="auth-subtitle"
    >
      سجّل الدخول للمتابعة إلى Aizen AI Builder.
    </div>

    <input
      id="nameInput"
      class="auth-input hidden"
      placeholder="اسمك"
    >

    <input
      id="emailInput"
      class="auth-input"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="passwordInput"
      class="auth-input"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      id="authPrimary"
      class="auth-primary"
      onclick="submitAuth()"
    >
      دخول
    </button>

    <div class="oauth-grid">

      <button
        class="auth-oauth"
        onclick="oauthLogin('google')"
      >
        Google
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('github')"
      >
        GitHub
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('discord')"
      >
        Discord
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('apple')"
      >
        Apple
      </button>

    </div>

    <div
      id="authSwitch"
      class="auth-link"
      onclick="switchAuthMode()"
    >
      إنشاء حساب جديد
    </div>

    <div
      class="auth-link"
      onclick="forgotPassword()"
    >
      نسيت كلمة المرور؟
    </div>

    <div
      class="auth-link"
      onclick="closeAuth()"
    >
      إغلاق
    </div>

  </div>

</div>


<!-- PROFILE -->

<div
  id="profileModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>الحساب</h3>

    <input
      id="profileName"
      class="auth-input"
      placeholder="اسم العرض"
    >

    <input
      id="profileAvatar"
      class="auth-input"
      placeholder="رابط الصورة"
    >

    <div class="modal-buttons">

      <button
        class="primary"
        onclick="saveProfile()"
      >
        حفظ
      </button>

      <button onclick="closeProfile()">
        إلغاء
      </button>

    </div>

  </div>

</div>


<!-- PROJECT -->

<div
  id="projectModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>مشروع جديد</h3>

    <input
      id="projectName"
      class="auth-input"
      placeholder="اسم المشروع"
    >

    <input
      id="projectType"
      class="auth-input"
      placeholder="النوع - Web / App / Bot"
    >

    <textarea
      id="projectDescription"
      class="auth-input"
      rows="4"
      placeholder="وصف المشروع"
    ></textarea>

    <div class="modal-buttons">

      <button
        class="primary"
        onclick="createProject()"
      >
        إنشاء
      </button>

      <button onclick="closeProjectModal()">
        إلغاء
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://krazsdizsiexwrokqwjh.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyYXpzZGl6c2lleHdyb2txd2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTI2MzksImV4cCI6MjEwNTY2ODYzOX0.hjikiUy3-iPaaxCSTTDLRqDKZB09nO8H0ChBjp8YHes";

const BACKEND_URL =
  "https://aizen-ai-builder.onrender.com";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentSession = null;

let conversations = [];
let projects = [];

let currentConversationId = null;
let currentProjectId = null;

let authMode = "login";
let generating = false;
let abortController = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const toast = $("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.style.display = "none";
    },3000);
}

function setStatus(message){
  $("status").textContent = message;
}

function formatDate(date){
  if(!date) return "";

  try{
    return new Date(date).toLocaleString(
      "ar",
      {
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }catch{
    return "";
  }
}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){
  $("sidebar").classList.toggle("open");
}

function closeSidebar(){
  $("sidebar").classList.remove("open");
}

function showSidebarTab(tab){

  const chats =
    tab === "chats";

  $("chatSidebar").style.display =
    chats ? "block" : "none";

  $("projectSidebar").style.display =
    chats ? "none" : "block";

  $("chatTab").classList.toggle(
    "active",
    chats
  );

  $("projectTab").classList.toggle(
    "active",
    !chats
  );
}


/* =========================================================
   AUTH UI
========================================================= */

function openAuth(){
  if(currentUser){
    toggleAccountMenu();
    return;
  }

  $("authOverlay").classList.remove("hidden");
}

function closeAuth(){
  $("authOverlay").classList.add("hidden");
}

function switchAuthMode(){

  authMode =
    authMode === "login"
      ? "signup"
      : "login";

  const signup =
    authMode === "signup";

  $("authTitle").textContent =
    signup
      ? "إنشاء حساب"
      : "تسجيل الدخول";

  $("authSubtitle").textContent =
    signup
      ? "أنشئ حسابك في Aizen AI Builder."
      : "سجّل الدخول للمتابعة.";

  $("nameInput")
    .classList
    .toggle("hidden",!signup);

  $("authPrimary").textContent =
    signup
      ? "إنشاء الحساب"
      : "دخول";

  $("authSwitch").textContent =
    signup
      ? "لدي حساب بالفعل"
      : "إنشاء حساب جديد";
}

async function submitAuth(){

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  const name =
    $("nameInput").value.trim();

  if(!email || !password){
    showToast("أدخل البريد وكلمة المرور.");
    return;
  }

  try{

    if(authMode === "signup"){

      if(!name){
        showToast("أدخل اسمك.");
        return;
      }

      const {data,error} =
        await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              display_name:name
            }
          }
        });

      if(error) throw error;

      if(data.session){
        showToast("تم إنشاء الحساب.");
      }else{
        showToast(
          "تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طُلب منك ذلك."
        );
      }

    }else{

      const {error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      showToast("تم تسجيل الدخول.");
    }

  }catch(error){

    console.error(error);

    showToast(
      error.message || "حدث خطأ أثناء تسجيل الدخول."
    );
  }
}

async function oauthLogin(provider){

  try{

    const {error} =
      await supabaseClient.auth.signInWithOAuth({
        provider,
        options:{
          redirectTo:window.location.origin
        }
      });

    if(error) throw error;

  }catch(error){

    showToast(
      error.message ||
      "تعذر تسجيل الدخول."
    );
  }
}

async function forgotPassword(){

  const email =
    $("emailInput").value.trim();

  if(!email){
    showToast("اكتب بريدك الإلكتروني أولاً.");
    return;
  }

  try{

    const {error} =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin
        }
      );

    if(error) throw error;

    showToast(
      "تم إرسال رابط إعادة تعيين كلمة المرور."
    );

  }catch(error){

    showToast(
      error.message ||
      "تعذر إرسال الرابط."
    );
  }
}

async function logout(){

  try{
    await supabaseClient.auth.signOut();
  }catch(error){
    console.error(error);
  }

  currentUser = null;
  currentSession = null;

  conversations = [];
  projects = [];

  currentConversationId = null;

  renderConversations();
  renderProjects();
  clearMessages();

  updateAuthUI();

  showToast("تم تسجيل الخروج.");
}

   AUTH STATE
========================================================= */

async function loadSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  currentSession =
    data.session || null;

  currentUser =
    currentSession?.user || null;

  updateAuthUI();

  if(currentUser){
    await ensureProfile();
    await loadConversations();
    await loadProjects();
  }
}

supabaseClient.auth.onAuthStateChange(
  async (_event,session)=>{

    currentSession = session;
    currentUser = session?.user || null;

    updateAuthUI();

    if(currentUser){

      await ensureProfile();
      await loadConversations();
      await loadProjects();

    }else{

      conversations = [];
      projects = [];

      renderConversations();
      renderProjects();
    }
  }
);

function updateAuthUI(){

  if(currentUser){

    $("loginButton")
      .classList
      .add("hidden");

    $("accountButton")
      .classList
      .remove("hidden");

    $("accountName")
      .classList
      .remove("hidden");

    const metadata =
      currentUser.user_metadata || {};

    $("accountName").textContent =
      metadata.display_name ||
      currentUser.email ||
      "حسابي";

    closeAuth();

  }else{

    $("loginButton")
      .classList
      .remove("hidden");

    $("accountButton")
      .classList
      .add("hidden");

    $("accountName")
      .classList
      .add("hidden");
  }
}

async function ensureProfile(){

  if(!currentUser) return;

  try{

    const {data,error} =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(error) throw error;

    if(!data){

      const name =
        currentUser.user_metadata?.display_name ||
        currentUser.email?.split("@")[0] ||
        "User";

      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          display_name:name,
          avatar_url:null
        });
    }

  }catch(error){

    console.error(
      "Profile error:",
      error
    );
  }
}

function openProfile(){

  $("accountMenu")
    .classList
    .add("hidden");

  if(!currentUser) return;

  $("profileName").value =
    currentUser.user_metadata?.display_name || "";

  $("profileAvatar").value =
    currentUser.user_metadata?.avatar_url || "";

  $("profileModal")
    .classList
    .remove("hidden");
}

function closeProfile(){
  $("profileModal")
    .classList
    .add("hidden");
}

async function saveProfile(){

  if(!currentUser) return;

  const name =
    $("profileName").value.trim();

  const avatar =
    $("profileAvatar").value.trim();

  try{

    const {error} =
      await supabaseClient.auth.updateUser({
        data:{
          display_name:name,
          avatar_url:avatar
        }
      });

    if(error) throw error;

    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        display_name:name,
        avatar_url:avatar
      });

    updateAuthUI();

    closeProfile();

    showToast("تم تحديث الحساب.");

  }catch(error){

    showToast(
      error.message ||
      "تعذر تحديث الحساب."
    );
  }
}

/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_id",currentUser.id)
      .eq("archived",false)
      .order("pinned",{ascending:false})
      .order("updated_at",{ascending:false});

  if(error){

    console.error(error);
    showToast("تعذر تحميل المحادثات.");
    return;
  }

  conversations = data || [];

  renderConversations();

  if(
    currentConversationId &&
    conversations.some(
      c=>c.id === currentConversationId
    )
  ){
    await loadMessages(
      currentConversationId
    );
  }
}

function renderConversations(){

  const container =
    $("conversationList");

  const search =
    $("searchInput").value
      .trim()
      .toLowerCase();

  let list =
    conversations.filter(c =>
      String(c.title || "محادثة جديدة")
        .toLowerCase()
        .includes(search)
    );

  if(!list.length){

    container.innerHTML =
      `<div class="empty-state">
        لا توجد محادثات بعد.
      </div>`;

    return;
  }

  container.innerHTML =
    list.map(c=>{

      const title =
        c.title ||
        "محادثة جديدة";

      return `
        <div
          class="conversation-item
          ${c.id === currentConversationId ? "active" : ""}"
        >

          <div
            class="conversation-main"
            onclick="openConversation('${c.id}')"
          >

            <div class="conversation-icon">
              ${c.pinned ? "📌" : "💬"}
            </div>

            <div class="conversation-info">

              <div class="conversation-title">
                ${escapeHTML(title)}
              </div>

              <div class="conversation-date">
                ${formatDate(c.updated_at)}
              </div>

            </div>

          </div>

          <button
            class="conversation-menu"
            onclick="conversationMenu(event,'${c.id}')"
          >
            ⋮
          </button>

        </div>
      `;

    }).join("");
}

async function createConversation(title="محادثة جديدة"){

  if(!currentUser){

    openAuth();
    throw new Error("AUTH_REQUIRED");
  }

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .insert({
        user_id:currentUser.id,
        title,
        pinned:false,
        archived:false,
        build_used:false
      })
      .select()
      .single();

  if(error) throw error;

  conversations.unshift(data);

  currentConversationId = data.id;

  renderConversations();

  clearMessages();

  return data;
}

async function newChat(){

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  try{

    await createConversation();

    closeSidebar();

    setStatus("محادثة جديدة.");

  }catch(error){

    console.error(error);

    showToast("تعذر إنشاء المحادثة.");
  }
}

async function openConversation(id){

  if(!currentUser) return;

  currentConversationId = id;

  renderConversations();

  await loadMessages(id);

  closeSidebar();
}

async function loadMessages(conversationId){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq("conversation_id",conversationId)
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);
    showToast("تعذر تحميل الرسائل.");
    return;
  }

  renderMessages(data || []);
}

function clearMessages(){

  $("messages").innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">A</div>
      <h1>مرحباً بك في Aizen AI Builder</h1>
      <p>
        اكتب فكرتك وسيساعدك Aizen في بناء مشروعك.
      </p>
    </div>
  `;
}

function renderMessages(messages){

  const container =
    $("messages");

  if(!messages.length){

    clearMessages();
    return;
  }

  container.innerHTML =
    messages.map(messageHTML).join("");

  scrollMessages();
}

function messageHTML(message){

  const user =
    message.role === "user";

  return `
    <div class="message ${user ? "user" : "assistant"}">

      <div class="message-avatar">
        ${user ? "أنت" : "A"}
      </div>

      <div class="message-content">
        ${escapeHTML(message.content)}
      </div>

    </div>
  `;
}

function addMessageToUI(role,content){

  const welcome =
    $("messages").querySelector(".welcome");

  if(welcome) welcome.remove();

  const div =
    document.createElement("div");

  div.className =
    `message ${role === "user" ? "user" : "assistant"}`;

  div.innerHTML = `
    <div class="message-avatar">
      ${role === "user" ? "أنت" : "A"}
    </div>

    <div class="message-content"></div>
  `;

  div.querySelector(
    ".message-content"
  ).textContent = content;

  $("messages").appendChild(div);

  scrollMessages();

  return div;
}

function scrollMessages(){

  const box =
    $("messages");

  box.scrollTop =
    box.scrollHeight;
}


/* =========================================================
   CONVERSATION ACTIONS
========================================================= */

async function conversationMenu(event,id){

  event.stopPropagation();

  const conversation =
    conversations.find(
      c=>c.id === id
    );

  if(!conversation) return;

  const action =
    prompt(
      "اكتب:\nrename لإعادة التسمية\npin للتثبيت\nunpin لإلغاء التثبيت\ndelete للحذف"
    );

  if(!action) return;

  const normalized =
    action.trim().toLowerCase();

  if(normalized === "rename"){

    const title =
      prompt(
        "الاسم الجديد:",
        conversation.title
      );

    if(!title) return;

    await updateConversation(
      id,
      {title:title.trim()}
    );

  }else if(normalized === "pin"){

    await updateConversation(
      id,
      {pinned:true}
    );

  }else if(normalized === "unpin"){

    await updateConversation(
      id,
      {pinned:false}
    );

  }else if(normalized === "delete"){

    if(
      !confirm(
        "هل تريد حذف هذه المحادثة؟"
      )
    ) return;

    await deleteConversation(id);
  }
}

async function updateConversation(id,updates){

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .update(updates)
      .eq("id",id)
      .eq("user_id",currentUser.id)
      .select()
      .single();

  if(error){

    showToast("تعذر تحديث المحادثة.");
    return;
  }

  const index =
    conversations.findIndex(
      c=>c.id === id
    );

  if(index !== -1){
    conversations[index] = data;
  }

  renderConversations();
}

async function deleteConversation(id){

  const {error:messageError} =
    await supabaseClient
      .from("messages")
      .delete()
      .eq("conversation_id",id)
      .eq("user_id",currentUser.id);

  if(messageError){

    console.error(messageError);
  }

  const {error} =
    await supabaseClient
      .from("conversations")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){

    showToast("تعذر حذف المحادثة.");
    return;
  }

  conversations =
    conversations.filter(
      c=>c.id !== id
    );

  if(currentConversationId === id){

    currentConversationId = null;
    clearMessages();
  }

  renderConversations();

  showToast("تم حذف المحادثة.");
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(generating) return;

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text) return;

  try{

    let conversation;

    if(currentConversationId){

      conversation =
        conversations.find(
          c=>c.id === currentConversationId
        );
    }

    if(!conversation){

      conversation =
        await createConversation(
          text.slice(0,60)
        );
    }

    const conversationId =
      conversation.id;

    const {error:insertError} =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"user",
          content:text,
          metadata:{}
        });

    if(insertError)
      throw insertError;

    addMessageToUI(
      "user",
      text
    );

    input.value = "";
    autoResizeTextarea();

    if(
      !conversation.title ||
      conversation.title === "محادثة جديدة"
    ){

      await updateConversation(
        conversationId,
        {
          title:text.slice(0,60)
        }
      );
    }

    await requestAI(
      conversationId,
      false
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "تعذر إرسال الرسالة."
    );
  }
}


/* =========================================================
   AI REQUEST / SSE
========================================================= */

async function requestAI(
  conversationId,
  isBuild
){

  if(!currentSession){

    const {data} =
      await supabaseClient.auth.getSession();

    currentSession =
      data.session;
  }

  if(!currentSession){

    showToast("انتهت جلسة الدخول.");
    return;
  }

  generating = true;

  $("sendButton").disabled = true;
  $("buildButton").disabled = true;

  $("stopButton").style.display =
    "inline-block";

  setStatus(
    isBuild
      ? "Aizen يقوم ببناء المشروع..."
      : "Aizen يفكر..."
  );

  abortController =
    new AbortController();

  const assistantElement =
    addMessageToUI(
      "assistant",
      ""
    );

  const contentElement =
    assistantElement.querySelector(
      ".message-content"
    );

  let fullText = "";

  try{

    const response =
      await fetch(
        `${BACKEND_URL}/api/chat`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${currentSession.access_token}`
          },

          body:JSON.stringify({
            conversationId,
            build:isBuild
          }),

          signal:
            abortController.signal
        }
      );

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        `HTTP ${response.status}`
      );
    }

    if(!response.body){

      throw new Error(
        "الخادم لم يرجع Stream."
      );
    }

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    while(true){

      const {value,done} =
        await reader.read();

      if(done) break;

      buffer +=
        decoder.decode(
          value,
          {stream:true}
        );

      const parts =
        buffer.split("\n");

      buffer =
        parts.pop() || "";

      for(
        const line of parts
      ){

        if(!line.startsWith("data:"))
          continue;

        const raw =
          line.slice(5).trim();

        if(!raw) continue;

        if(raw === "[DONE]")
          continue;

        try{

          const data =
            JSON.parse(raw);

          const delta =
            data.text ??
            data.delta ??
            data.content ??
            "";

          if(delta){

            fullText += delta;

            contentElement.textContent =
              fullText;

            scrollMessages();
          }

        }catch{

          fullText +=
            raw;

          contentElement.textContent =
            fullText;

          scrollMessages();
        }
      }
    }

    if(!fullText){

      fullText =
        "لم يصل رد من Aizen.";

      contentElement.textContent =
        fullText;
    }

    const {error:saveError} =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"assistant",
          content:fullText,
          metadata:{
            build:isBuild
          }
        });

    if(saveError)
      console.error(saveError);

    await supabaseClient
      .from("conversations")
      .update({
        updated_at:
          new Date().toISOString(),
        ...(isBuild
          ? {
              build_used:true,
              build_used_at:
                new Date().toISOString()
            }
          : {})
      })
      .eq("id",conversationId)
      .eq("user_id",currentUser.id);

    await loadConversations();

    setStatus(
      isBuild
        ? "اكتمل البناء."
        : "تم الرد."
    );

  }catch(error){

    if(error.name === "AbortError"){

      setStatus("تم إيقاف التوليد.");

      return;
    }

    console.error(error);

    contentElement.textContent =
      `حدث خطأ: ${error.message}`;

    setStatus("حدث خطأ.");
  }finally{

    generating = false;

    $("sendButton").disabled = false;
    $("buildButton").disabled = false;

    $("stopButton").style.display =
      "none";

    abortController = null;
  }
}


/* =========================================================
   BUILD
========================================================= */

async function startBuild(){

  if(generating) return;

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  if(!currentConversationId){

    showToast(
      "اكتب فكرة المشروع أولاً."
    );

    return;
  }

  const conversation =
    conversations.find(
      c=>c.id === currentConversationId
    );

  if(
    conversation &&
    conversation.build_used
  ){

    showToast(
      "تم استخدام Build لهذه المحادثة مسبقاً."
    );

    return;
  }

  await requestAI(
    currentConversationId,
    true
  );
}

function stopGeneration(){

  if(
    generating &&
    abortController
  ){

    abortController.abort();
  }
}

async function loadProjects(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("projects")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("updated_at",{ascending:false});

  if(error){

    console.error(error);
    showToast("تعذر تحميل المشاريع.");
    return;
  }

  projects =
    data || [];

  renderProjects();
}

function renderProjects(){

  const container =
    $("projectList");

  if(!projects.length){

    container.innerHTML = `
      <div class="empty-state">
        لا توجد مشاريع.
        <br><br>
        يمكنك إنشاء مشروع جديد.
        <br><br>
        <button
          class="build-button"
          onclick="openProjectModal()"
        >
          ＋ مشروع
        </button>
      </div>
    `;

    return;
  }

  container.innerHTML =
    projects.map(project=>`

      <div class="project-item">

        <div
          class="project-name"
          onclick="openProject('${project.id}')"
        >
          📁 ${escapeHTML(project.name)}
        </div>

        <div class="project-type">
          ${escapeHTML(project.type || "Project")}
        </div>

        <div class="project-actions">

          <button
            onclick="openProject('${project.id}')"
          >
            فتح
          </button>

          <button
            onclick="deleteProject('${project.id}')"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");
}

  try{

    const {data,error} =
      await supabaseClient
        .from("projects")
        .insert({
          user_id:currentUser.id,
          name,
          type,
          description,
          status:"draft"
        })
        .select()
        .single();

    if(error) throw error;

    projects.unshift(data);

    renderProjects();

    $("projectName").value = "";
    $("projectType").value = "";
    $("projectDescription").value = "";

    closeProjectModal();

    showSidebarTab("projects");

    showToast("تم إنشاء المشروع.");

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "تعذر إنشاء المشروع."
    );
  }
}

function openProject(id){

  const project =
    projects.find(
      p=>p.id === id
    );

  if(!project) return;

  currentProjectId = id;

  showSidebarTab("projects");

  setStatus(
    `المشروع الحالي: ${project.name}`
  );

  showToast(
    `تم فتح ${project.name}`
  );
}

async function deleteProject(id){

  const project =
    projects.find(
      p=>p.id === id
    );

  if(!project) return;

  if(
    !confirm(
      `حذف المشروع "${project.name}"؟`
    )
  ) return;

  const {error} =
    await supabaseClient
      .from("projects")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){

    showToast(
      error.message ||
      "تعذر حذف المشروع."
    );

    return;
  }

  projects =
    projects.filter(
      p=>p.id !== id
    );

  if(currentProjectId === id)
    currentProjectId = null;

  renderProjects();

  showToast("تم حذف المشروع.");
}


/* =========================================================
   FILE UPLOAD UI
========================================================= */

function triggerFileUpload(){

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  $("fileInput").click();
}

$("fileInput").addEventListener(
  "change",
  event=>{

    const files =
      Array.from(
        event.target.files || []
      );

    if(!files.length) return;

    const names =
      files.map(
        file=>file.name
      ).join(", ");

    setStatus(
      `تم اختيار: ${names}`
    );

    showToast(
      `${files.length} ملف تم اختياره.`
    );
  }
);


/* =========================================================
   SEARCH
========================================================= */

$("searchInput")
  .addEventListener(
    "input",
    renderConversations
  );


/* =========================================================
   TEXTAREA
========================================================= */

$("messageInput")
  .addEventListener(
    "input",
    autoResizeTextarea
  );

$("messageInput")
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();
      }
    }
  );

function autoResizeTextarea(){

  const textarea =
    $("messageInput");

  textarea.style.height =
    "auto";

  textarea.style.height =
    Math.min(
      textarea.scrollHeight,
      180
    ) + "px";
}

    );

  }catch(error){

      "تعذر تهيئة التطبيق."
    );

})();
