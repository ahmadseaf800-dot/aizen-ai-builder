<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aizen AI Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: #f4f4f5;
      font-family: Arial, Tahoma, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      border-bottom: 1px solid #242730;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #0d0f14;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .logo,
    .welcome-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 18px;
    }

    .new-chat {
      border: 1px solid #30333d;
      background: #151821;
      color: #ddd;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 150px;
    }

    .chat {
      width: min(900px, 100%);
      margin: auto;
    }

    .welcome {
      text-align: center;
      padding: 70px 10px 40px;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 20px;
      font-size: 30px;
      box-shadow: 0 10px 40px rgba(90, 70, 255, .25);
    }

    .welcome h1 {
      margin: 20px 0 8px;
      font-size: 30px;
    }

    .welcome p {
      color: #9699a3;
      margin: 0;
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 25px 0;
      line-height: 1.75;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #20232d;
    }

    .message.ai .avatar {
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #272a34;
    }

    .message.ai .bubble {
      background: #151820;
      border: 1px solid #242731;
    }

    .thinking {
      color: #9296a2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dots {
      display: inline-flex;
      gap: 3px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #9b9da5;
      animation: blink 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 70%, 100% {
        opacity: .25;
      }
      35% {
        opacity: 1;
      }
    }

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px;
      background: linear-gradient(
        transparent,
        #0b0d12 25%
      );
    }

    .composer {
      width: min(900px, 100%);
      margin: auto;
      background: #151820;
      border: 1px solid #30333e;
      border-radius: 17px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
    }

    textarea {
      width: 100%;
      resize: none;
      min-height: 48px;
      max-height: 180px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      font-family: inherit;
      padding: 10px;
    }

    textarea::placeholder {
      color: #777b86;
    }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px;
    }

    .left-buttons,
    .right-buttons {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .icon-btn,
    .build-btn,
    .send-btn {
      border: 1px solid #30333e;
      background: #1c1f28;
      color: #ddd;
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .build-btn {
      background: #29204a;
      border-color: #5c43a8;
      color: #d9ceff;
    }

    .send-btn {
      width: 42px;
      height: 38px;
      padding: 0;
      font-size: 18px;
      background: #eee;
      color: #111;
    }

    .send-btn:disabled,
    .build-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .status {
      width: min(900px, 100%);
      margin: 7px auto 0;
      text-align: center;
      font-size: 11px;
      color: #686c77;
    }

    /* BUILD MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(7px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .build-modal {
      width: min(650px, 100%);
      background: #12151c;
      border: 1px solid #30333e;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
      animation: modalIn .18s ease;
    }

    @keyframes modalIn {
      from {
        transform: translateY(15px) scale(.97);
        opacity: 0;
      }

      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid #30333e;
      background: #1b1e27;
      color: #aaa;
      cursor: pointer;
      font-size: 18px;
    }

    .build-subtitle {
      color: #8e929e;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .project-types {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .project-type {
      border: 1px solid #30333e;
      background: #191c24;
      color: white;
      border-radius: 13px;
      padding: 16px;
      text-align: right;
      cursor: pointer;
      transition: .15s;
    }

    .project-type:hover {
      border-color: #7657db;
      background: #211d31;
      transform: translateY(-1px);
    }

    .project-type.selected {
      border-color: #8b5cf6;
      background: #282040;
      box-shadow: 0 0 0 1px #8b5cf6;
    }

    .type-icon {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .type-name {
      font-size: 16px;
      font-weight: bold;
    }

    .type-description {
      color: #888c98;
      font-size: 12px;
      margin-top: 4px;
    }

    .project-description {
      display: none;
      margin-top: 18px;
    }

    .project-description.show {
      display: block;
    }

    .project-description label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    .project-description textarea {
      min-height: 110px;
      max-height: 200px;
      width: 100%;
      background: #0d1016;
      border: 1px solid #30333e;
      border-radius: 12px;
      padding: 13px;
      resize: vertical;
    }

    .start-build {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-build:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .project-types {
        grid-template-columns: 1fr;
      }

      .build-modal {
        padding: 17px;
      }

      .welcome {
        padding-top: 45px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="logo">🤖</div>
      <span>Aizen AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ محادثة جديدة
    </button>
  </header>

  <main id="main">
    <div class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">🤖</div>

        <h1>مرحباً بك في Aizen AI</h1>

        <p>
          ابنِ المواقع والتطبيقات والبوتات بمساعدة الذكاء الاصطناعي.
        </p>
      </div>

    </div>
  </main>

  <div class="composer-wrap">

    <div class="composer">

      <textarea
        id="messageInput"
        placeholder="اسأل Aizen أي شيء..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>

      <div class="composer-bottom">

        <div class="left-buttons">

          <button
            class="icon-btn"
            onclick="document.getElementById('fileInput').click()"
          >
            ＋
          </button>

          <input
            id="fileInput"
            type="file"
            style="display:none"
          >

        </div>

        <div class="right-buttons">

          <button
            id="buildBtn"
            class="build-btn"
            onclick="openBuildModal()"
          >
            🛠️ Build
          </button>

          <button
            id="sendBtn"
            class="send-btn"
            onclick="sendMessage()"
          >
            ↑
          </button>

        </div>

      </div>

    </div>

    <div class="status">
      Aizen AI يمكن أن يخطئ. تحقق من المعلومات المهمة.
    </div>

  </div>

</div>


<!-- BUILD MODAL -->

<div
  id="buildModal"
  class="modal-overlay"
  onclick="closeBuildOnOverlay(event)"
>

  <div class="build-modal">

    <div class="modal-header">

      <div class="modal-title">
        🛠️ ماذا تريد أن تبني؟
      </div>

      <button
        class="close-btn"
        onclick="closeBuildModal()"
      >
        ×
      </button>

    </div>

    <div class="build-subtitle">
      اختر نوع المشروع الذي تريد من Aizen AI بناءه.
    </div>

    <div class="project-types">

      <button
        class="project-type"
        onclick="selectProjectType('موقع', this)"
      >
        <div class="type-icon">🌐</div>
        <div class="type-name">موقع</div>
        <div class="type-description">
          مواقع وصفحات ويب حديثة
        </div>
      </button>

      <button
        class="project-type"
        onclick="selectProjectType('تطبيق', this)"
      >
        <div class="type-icon">📱</div>
        <div class="type-name">تطبيق</div>
        <div class="type-description">
          تطبيقات الهاتف والويب
        </div>
      </button>

      <button
        class="project-type"
        onclick="selectProjectType('بوت', this)"
      >
        <div class="type-icon">🤖</div>
        <div class="type-name">بوت</div>
        <div class="type-description">
          Telegram و Discord وغيرها
        </div>
      </button>

      <button
        class="project-type"
        onclick="selectProjectType('لعبة', this)"
      >
        <div class="type-icon">🎮</div>
        <div class="type-name">لعبة</div>
        <div class="type-description">
          ألعاب ومشاريع تفاعلية
        </div>
      </button>

      <button
        class="project-type"
        onclick="selectProjectType('مشروع مخصص', this)"
      >
        <div class="type-icon">⚙️</div>
        <div class="type-name">مشروع مخصص</div>
        <div class="type-description">
          أي فكرة أخرى
        </div>
      </button>

    </div>

    <div
      id="projectDescription"
      class="project-description"
    >

      <label>
        اشرح لـ Aizen ماذا تريد أن يبني:
      </label>

      <textarea
        id="buildDescription"
        placeholder="مثال: أريد موقع متجر إلكتروني فيه تسجيل دخول، منتجات، سلة شراء وصفحة دفع..."
        oninput="updateBuildButton()"
      ></textarea>

      <button
        id="startBuildBtn"
        class="start-build"
        disabled
        onclick="startBuild()"
      >
        🚀 ابدأ بناء المشروع
      </button>

    </div>

  </div>

</div>


<script>

const RENDER_URL =
  "https://aizen-ai-builder.onrender.com";

let isGenerating = false;
let selectedProjectType = "";

function getApiUrl() {

  if (
    window.location.hostname ===
    "aizen-ai-builder.onrender.com"
  ) {
    return "/api/chat";
  }

  return RENDER_URL + "/api/chat";
}


function scrollToBottom() {

  const main =
    document.getElementById("main");

  setTimeout(() => {
    main.scrollTop =
      main.scrollHeight;
  }, 20);
}


function removeWelcome() {

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }
}


function addMessage(type, text) {

  removeWelcome();

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "user"
      ? "👤"
      : "🤖";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(avatar);
  message.appendChild(bubble);

  chat.appendChild(message);

  scrollToBottom();

  return bubble;
}


function addThinking() {

  removeWelcome();

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "thinkingMessage";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    "🤖";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble thinking";

  bubble.innerHTML = `
    جاري التفكير
    <span class="dots">
      <span></span>
      <span></span>
      <span></span>
    </span>
  `;

  message.appendChild(avatar);
  message.appendChild(bubble);

  chat.appendChild(message);

  scrollToBottom();

  return message;
}


function replaceThinkingWithStream() {

  const thinking =
    document.getElementById(
      "thinkingMessage"
    );

  if (!thinking) {
    return addMessage(
      "ai",
      ""
    );
  }

  const bubble =
    thinking.querySelector(
      ".bubble"
    );

  bubble.className =
    "bubble";

  bubble.innerHTML = "";

  return bubble;
}


function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();
  }
}


function autoResize(element) {

  element.style.height =
    "auto";

  element.style.height =
    Math.min(
      element.scrollHeight,
      180
    ) + "px";
}


function setGenerating(value) {

  isGenerating =
    value;

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const buildBtn =
    document.getElementById(
      "buildBtn"
    );

  sendBtn.disabled =
    value;

  buildBtn.disabled =
    value;

  sendBtn.textContent =
    value
      ? "…"
      : "↑";
}


async function sendMessage(
  customMessage = null
) {

  if (isGenerating) return;

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    customMessage !== null
      ? customMessage.trim()
      : input.value.trim();

  if (!message) return;

  if (
    customMessage === null
  ) {

    input.value = "";

    input.style.height =
      "auto";
  }

  addMessage(
    "user",
    message
  );

  addThinking();

  setGenerating(true);

  try {

    const response =
      await fetch(
        getApiUrl(),
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message:
              message
          })
        }
      );

    if (!response.ok) {

      const errorText =
        await response.text();

      let errorMessage =
        errorText;

      try {

        const errorJSON =
          JSON.parse(
            errorText
          );

        errorMessage =
          errorJSON.error ||
          errorJSON.message ||
          errorText;

      } catch {}

      throw new Error(
        errorMessage ||
        "حدث خطأ في السيرفر"
      );
    }

    if (!response.body) {

      throw new Error(
        "المتصفح لا يدعم Streaming."
      );
    }

    const aiBubble =
      replaceThinkingWithStream();

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder(
        "utf-8"
      );

    let buffer = "";
    let receivedText =
      false;

    while (true) {

      const result =
        await reader.read();

      if (result.done)
        break;

      buffer +=
        decoder.decode(
          result.value,
          {
            stream: true
          }
        );

      const events =
        buffer.split(
          "\n\n"
        );

      buffer =
        events.pop() || "";

      for (
        const eventBlock
        of events
      ) {

        processStreamEvent(
          eventBlock,
          aiBubble,
          () => {
            receivedText =
              true;
          }
        );
      }

      scrollToBottom();
    }

    if (buffer.trim()) {

      processStreamEvent(
        buffer,
        aiBubble,
        () => {
          receivedText =
            true;
        }
      );
    }

    if (!receivedText) {

      aiBubble.textContent =
        "❌ لم يصل أي نص من Aizen.";
    }

  } catch (error) {

    console.error(error);

    const thinking =
      document.getElementById(
        "thinkingMessage"
      );

    if (thinking) {

      const bubble =
        thinking.querySelector(
          ".bubble"
        );

      bubble.className =
        "bubble";

      bubble.textContent =
        "❌ حدث خطأ:\n" +
        error.message;
    }

  } finally {

    setGenerating(false);

    scrollToBottom();
  }
}


function processStreamEvent(
  eventBlock,
  bubble,
  onText
) {

  if (!eventBlock)
    return;

  const lines =
    eventBlock.split("\n");

  let eventType = "";
  let dataText = "";

  for (
    const line of lines
  ) {

    if (
      line.startsWith(
        "event:"
      )
    ) {

      eventType =
        line
          .slice(6)
          .trim();
    }

    if (
      line.startsWith(
        "data:"
      )
    ) {

      dataText +=
        line
          .slice(5)
          .trim();
    }
  }

  if (!dataText)
    return;

  try {

    const data =
      JSON.parse(
        dataText
      );

    if (
      eventType === "text" &&
      data.text
    ) {

      bubble.textContent +=
        data.text;

      onText();

      scrollToBottom();

      return;
    }

    if (
      eventType === "error"
    ) {

      bubble.textContent =
        "❌ " +
        (
          data.error ||
          "حدث خطأ أثناء التوليد"
        );

      return;
    }

  } catch (error) {

    console.error(
      "Stream event error:",
      error
    );
  }
}


/* BUILD SYSTEM */

function openBuildModal() {

  if (isGenerating)
    return;

  document
    .getElementById(
      "buildModal"
    )
    .classList.add(
      "show"
    );
}


function closeBuildModal() {

  document
    .getElementById(
      "buildModal"
    )
    .classList.remove(
      "show"
    );
}


function closeBuildOnOverlay(
  event
) {

  if (
    event.target.id ===
    "buildModal"
  ) {

    closeBuildModal();
  }
}


function selectProjectType(
  type,
  element
) {

  selectedProjectType =
    type;

  document
    .querySelectorAll(
      ".project-type"
    )
    .forEach(
      button => {
        button.classList.remove(
          "selected"
        );
      }
    );

  element.classList.add(
    "selected"
  );

  document
    .getElementById(
      "projectDescription"
    )
    .classList.add(
      "show"
    );

  document
    .getElementById(
      "buildDescription"
    )
    .focus();

  updateBuildButton();
}


function updateBuildButton() {

  const description =
    document
      .getElementById(
        "buildDescription"
      )
      .value
      .trim();

  document
    .getElementById(
      "startBuildBtn"
    )
    .disabled =
      !selectedProjectType ||
      !description;
}


function startBuild() {

  if (
    !selectedProjectType
  ) return;

  const description =
    document
      .getElementById(
        "buildDescription"
      )
      .value
      .trim();

  if (!description)
    return;

  const prompt =
    `أريد بناء مشروع من نوع: ${selectedProjectType}

وصف المشروع:
${description}
