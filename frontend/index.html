<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aizen AI Builder</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  font-family:Arial,"Segoe UI",sans-serif;
  background:#0b0d12;
  color:#f4f5f7;
  overflow:hidden;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#101218;
  border-bottom:1px solid #252832;
  position:relative;
  z-index:30;
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.menu-button,
.header-button{
  width:38px;
  height:38px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#181b22;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
}

.brand-logo{
  width:32px;
  height:32px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c5cff,#4b8cff);
  font-weight:900;
}

.account-name{
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  min-width:280px;
  background:#101218;
  border-left:1px solid #252832;
  display:flex;
  flex-direction:column;
}

.sidebar-top{
  padding:12px;
}

.new-chat-button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:11px;
  background:#6d5dfc;
  color:#fff;
  font-weight:700;
}

.search-box{
  margin-top:10px;
}

.search-box input{
  width:100%;
  padding:10px;
  border:1px solid #30343e;
  border-radius:10px;
  outline:none;
  background:#181b22;
  color:#fff;
}

.sidebar-tabs{
  display:flex;
  gap:5px;
  padding:0 12px 10px;
}

.sidebar-tab{
  flex:1;
  padding:8px 5px;
  border:1px solid #30343e;
  border-radius:9px;
  background:#181b22;
  color:#aeb3bf;
}

.sidebar-tab.active{
  background:#242132;
  color:#fff;
  border-color:#6d5dfc;
}

.sidebar-content{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0 8px 10px;
}

.empty-state{
  padding:25px 10px;
  text-align:center;
  color:#777d89;
  font-size:13px;
}

/* CONVERSATIONS */

.conversation-item{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:4px;
  border-radius:10px;
}

.conversation-item:hover,
.conversation-item.active{
  background:#20242d;
}

.conversation-main{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
  cursor:pointer;
}

.conversation-icon{
  width:30px;
  min-width:30px;
  height:30px;
  border-radius:8px;
  background:#181b22;
  display:flex;
  align-items:center;
  justify-content:center;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.conversation-date{
  margin-top:3px;
  color:#777d89;
  font-size:10px;
}

.conversation-menu{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#888e9a;
  position:relative;
  z-index:2;
}
.conversation-menu>button{
  width:34px;height:34px;border:0;border-radius:8px;
  background:transparent;color:#888e9a;cursor:pointer;
}
.conversation-actions{
  position:absolute;
  top:36px;
  left:0;
  width:155px;
  padding:5px;
  display:none;
  flex-direction:column;
  gap:4px;
  background:#15181f;
  border:1px solid #30343e;
  border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  z-index:60;
}
.conversation-actions.open{display:flex}
.conversation-actions button{
  width:100%;
  padding:8px 9px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#fff;
  text-align:right;
  font-size:12px;
}
.conversation-actions button:hover{background:#242832}
.conversation-actions .danger{color:#ff8f9c}

/* PROJECTS */

.project-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.project-item{
  padding:11px;
  border:1px solid #2a2e38;
  border-radius:10px;
  background:#15181f;
}

.project-name{
  font-size:13px;
  font-weight:700;
}

.project-type{
  margin-top:4px;
  color:#858b97;
  font-size:10px;
}

.project-actions{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.project-actions button{
  flex:1;
  padding:6px;
  border:1px solid #30343e;
  border-radius:7px;
  background:#1b1e26;
  color:#fff;
  font-size:11px;
}

/* CHAT */

.chat-area{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:24px 16px 160px;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.welcome-logo{
  width:65px;
  height:65px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c5cff,#4b8cff);
  font-size:30px;
  font-weight:900;
  margin-bottom:18px;
}

.welcome h1{
  margin:0;
  font-size:24px;
}

.welcome p{
  color:#8c929e;
  font-size:14px;
}

/* MESSAGE */

.message{
  width:min(900px,100%);
  margin:0 auto 18px;
  display:flex;
  gap:10px;
}

.message.user{
  flex-direction:row-reverse;
}

.message-avatar{
  width:34px;
  min-width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20242d;
  font-size:12px;
  font-weight:700;
}

.message.user .message-avatar{
  background:#6d5dfc;
}

.message-content{
  max-width:calc(100% - 45px);
  padding:11px 13px;
  border-radius:13px;
  background:#15181f;
  border:1px solid #282c35;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.55;
  font-size:14px;
}

.message.user .message-content{
  background:#28224d;
  border-color:#40377a;
}

/* COMPOSER */

.composer-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px 15px 16px;
  background:linear-gradient(to top,#0b0d12 70%,transparent);
  pointer-events:none;
}

.composer{
  width:min(900px,100%);
  margin:auto;
  padding:8px;
  border:1px solid #343844;
  border-radius:15px;
  background:#15181f;
  pointer-events:auto;
}

.attachment-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:2px 3px 6px;
}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:6px;
  max-width:100%;
  padding:5px 8px;
  border:1px solid #30343e;
  border-radius:8px;
  background:#1b1e26;
  color:#cfd3dc;
  font-size:11px;
}

.attachment-chip span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:220px;
}

.attachment-remove{
  border:0;
  background:transparent;
  color:#aeb3bf;
  padding:0 2px;
  font-size:14px;
  line-height:1;
}

.composer textarea{
  width:100%;
  min-height:45px;
  max-height:180px;
  resize:none;
  padding:10px;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  line-height:1.5;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.composer-actions{
  display:flex;
  gap:6px;
}

.composer-button,
.send-button,
.stop-button{
  width:38px;
  height:38px;
  border-radius:9px;
}

.composer-button{
  border:1px solid #30343e;
  background:#1b1e26;
  color:#fff;
}

.send-button{
  border:0;
  background:#6d5dfc;
  color:#fff;
}

.stop-button{
  display:none;
  border:0;
  background:#a83d4b;
  color:#fff;
}

.build-button{
  padding:8px 13px;
  border:1px solid #5148a0;
  border-radius:9px;
  background:#28224d;
  color:#fff;
  font-weight:700;
}

/* AUTH */

.auth-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
}

.auth-box{
  width:min(420px,100%);
  padding:25px;
  border:1px solid #30343e;
  border-radius:18px;
  background:#12151c;
}

.auth-box h2{
  margin:0 0 8px;
}

.auth-subtitle{
  color:#858b97;
  font-size:13px;
  margin-bottom:18px;
}

.auth-input{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border:1px solid #30343e;
  border-radius:10px;
  outline:none;
  background:#191c23;
  color:#fff;
}

.auth-primary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#6d5dfc;
  color:#fff;
  font-weight:700;
}

.oauth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.auth-oauth{
  padding:10px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#191c23;
  color:#fff;
}

.auth-link{
  margin-top:12px;
  color:#9b90ff;
  text-align:center;
  cursor:pointer;
  font-size:13px;
}

/* ACCOUNT MENU */

.account-menu{
  position:absolute;
  top:52px;
  left:14px;
  width:190px;
  padding:7px;
  border:1px solid #30343e;
  border-radius:12px;
  background:#15181f;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  z-index:80;
}

.account-menu button{
  width:100%;
  padding:9px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#fff;
  text-align:right;
}

.account-menu button:hover{
  background:#242832;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
}

.modal-box{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  padding:20px;
  border:1px solid #30343e;
  border-radius:15px;
  background:#12151c;
}

.modal-box h3{
  margin-top:0;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-buttons button{
  flex:1;
  padding:10px;
  border:1px solid #30343e;
  border-radius:9px;
  background:#191c23;
  color:#fff;
}

.primary{
  background:#6d5dfc!important;
  border-color:#6d5dfc!important;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:200;
  padding:11px 16px;
  border:1px solid #30343e;
  border-radius:10px;
  background:#181b22;
  color:#fff;
  display:none;
  max-width:90%;
  text-align:center;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    top:58px;
    bottom:0;
    right:0;
    z-index:50;
    transform:translateX(100%);
    transition:transform .2s;
    box-shadow:-10px 0 35px rgba(0,0,0,.4);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .brand{
    font-size:14px;
  }

  .account-name{
    display:none;
  }

  .messages{
    padding:18px 10px 150px;
  }

  .message-content{
    font-size:13px;
  }

  .welcome h1{
    font-size:20px;
  }

  .composer-wrap{
    padding:8px 8px 10px;
  }
}

.ai-avatar{width:42px;height:42px;min-width:42px;border-radius:50%;object-fit:cover;border:1px solid #3b3f4b;background:#171a22;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.build-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.build-type-card{padding:14px;border:1px solid #30343e;border-radius:13px;background:#181b22;color:#fff;text-align:right;transition:.15s}
.build-type-card:hover{border-color:#6d5dfc;background:#211e35;transform:translateY(-1px)}
.build-type-icon{font-size:25px;margin-bottom:7px}.build-type-title{font-weight:700;font-size:13px}.build-type-desc{margin-top:4px;color:#858b97;font-size:11px;line-height:1.45}
@media(max-width:520px){.build-type-grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="header-left">

    <button
      class="menu-button"
      type="button"
      onclick="toggleSidebar()"
    >☰</button>

    <div class="brand">
      <div class="brand-logo">A</div>
      <span>Aizen AI Builder</span>
    </div>

  </div>

  <div class="header-right">

    <span
      id="accountName"
      class="account-name hidden"
    ></span>

    <button
      id="loginButton"
      class="header-button"
      type="button"
      onclick="openAuth()"
    >
      دخول
    </button>

    <button
      id="accountButton"
      class="header-button hidden"
      type="button"
      onclick="toggleAccountMenu()"
    >
      👤
    </button>

  </div>

  <div
    id="accountMenu"
    class="account-menu hidden"
  >
    <button onclick="openProfile()">👤 الحساب</button>
    <button onclick="logout()">🚪 تسجيل الخروج</button>
  </div>

</header>


<main class="main">

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-top">

    <button
      class="new-chat-button"
      onclick="newChat()"
    >
      ＋ محادثة جديدة
    </button>

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="بحث في المحادثات..."
      >

    </div>

  </div>


  <div class="sidebar-tabs">

    <button
      id="chatTab"
      class="sidebar-tab active"
      onclick="showSidebarTab('chats')"
    >
      💬 المحادثات
    </button>

    <button
      id="projectTab"
      class="sidebar-tab"
      onclick="showSidebarTab('projects')"
    >
      📁 المشاريع
    </button>

  </div>


  <div
    id="chatSidebar"
    class="sidebar-content"
  >
    <div id="conversationList"></div>
  </div>


  <div
    id="projectSidebar"
    class="sidebar-content"
    style="display:none"
  >
    <div id="projectList" class="project-list"></div>
  </div>

</aside>


<section class="chat-area">

  <div
    id="messages"
    class="messages"
  >

    <div class="welcome">

      <img class="ai-avatar" src="https://api.dicebear.com/9.x/bottts-neutral/svg?seed=AizenAI&backgroundColor=0b0d12" alt="Aizen AI" onerror="this.style.display='none'">

      <h1>مرحباً بك في Aizen AI Builder</h1>

      <p>
        اكتب فكرتك وسيساعدك Aizen في بناء مشروعك.
      </p>

    </div>

  </div>


  <div class="composer-wrap">

    <div class="composer">

      <div id="attachmentList" class="attachment-list" aria-live="polite"></div>

      <textarea
        id="messageInput"
        placeholder="اكتب فكرتك هنا..."
        rows="1"
      ></textarea>


      <div class="composer-bottom">

        <div class="composer-actions">

          <button
            class="composer-button"
            onclick="triggerFileUpload()"
          >
            📎
          </button>

          <button
            id="buildButton"
            class="build-button"
            onclick="openBuildTypeModal()"
          >
            Build
          </button>

        </div>


        <div>

          <button
            id="stopButton"
            class="stop-button"
            onclick="stopGeneration()"
          >
            ■
          </button>

          <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      Aizen AI جاهز للعمل.
    </div>

  </div>

</section>

</main>
</div>


<input
  id="fileInput"
  type="file"
  multiple
  hidden
>


<!-- AUTH -->

<div
  id="authOverlay"
  class="auth-overlay hidden"
>

  <div class="auth-box">

    <h2 id="authTitle">تسجيل الدخول</h2>

    <div
      id="authSubtitle"
      class="auth-subtitle"
    >
      سجّل الدخول للمتابعة إلى Aizen AI Builder.
    </div>

    <input
      id="nameInput"
      class="auth-input hidden"
      placeholder="اسمك"
    >

    <input
      id="emailInput"
      class="auth-input"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="passwordInput"
      class="auth-input"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      id="authPrimary"
      class="auth-primary"
      onclick="submitAuth()"
    >
      دخول
    </button>

    <div class="oauth-grid">

      <button
        class="auth-oauth"
        onclick="oauthLogin('google')"
      >
        Google
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('github')"
      >
        GitHub
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('discord')"
      >
        Discord
      </button>

      <button
        class="auth-oauth"
        onclick="oauthLogin('apple')"
      >
        Apple
      </button>

    </div>

    <div
      id="authSwitch"
      class="auth-link"
      onclick="switchAuthMode()"
    >
      إنشاء حساب جديد
    </div>

    <div
      class="auth-link"
      onclick="forgotPassword()"
    >
      نسيت كلمة المرور؟
    </div>

    <div
      class="auth-link"
      onclick="closeAuth()"
    >
      إغلاق
    </div>

  </div>

</div>


<!-- PROFILE -->

<div
  id="profileModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>الحساب</h3>

    <input
      id="profileName"
      class="auth-input"
      placeholder="اسم العرض"
    >

    <input
      id="profileAvatar"
      class="auth-input"
      placeholder="رابط الصورة"
    >

    <div class="modal-buttons">

      <button
        class="primary"
        onclick="saveProfile()"
      >
        حفظ
      </button>

      <button onclick="closeProfile()">
        إلغاء
      </button>

    </div>

  </div>

</div>


<!-- PROJECT -->

<div
  id="projectModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>مشروع جديد</h3>

    <input
      id="projectName"
      class="auth-input"
      placeholder="اسم المشروع"
    >

    <input
      id="projectType"
      class="auth-input"
      placeholder="النوع - Web / App / Bot"
    >

    <textarea
      id="projectDescription"
      class="auth-input"
      rows="4"
      placeholder="وصف المشروع"
    ></textarea>

    <div class="modal-buttons">

      <button
        class="primary"
        onclick="createProject()"
      >
        إنشاء
      </button>

      <button onclick="closeProjectModal()">
        إلغاء
      </button>

    </div>

  </div>

</div>



<div id="buildTypeModal" class="modal hidden">
  <div class="modal-box">
    <h3>ماذا تريد أن تبني؟</h3>

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

function showToast(message){
  const toast = $("toast");

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.style.display = "none";
    },3000);
}

function setStatus(message){

function formatDate(date){
  if(!date) return "";

  try{
    return new Date(date).toLocaleString(
      "ar",
      {
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }catch{
    return "";
  }
}

    if(authMode === "signup"){

      if(!name){
        showToast("أدخل اسمك.");
        return;
      }

      const {data,error} =
        await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              display_name:name
            }
          }
        });

      if(error) throw error;

      if(data.session){
        showToast("تم إنشاء الحساب.");
      }else{
        showToast(

          password
        });

async function loadConversations(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_id",currentUser.id)
      .eq("archived",false)
      .order("pinned",{ascending:false})
      .order("updated_at",{ascending:false});

  if(error){

    console.error(error);
    showToast("تعذر تحميل المحادثات.");
    return;
  }

  conversations = data || [];

  renderConversations();

  if(
    currentConversationId &&
    conversations.some(
      c=>c.id === currentConversationId
    )
  ){
    await loadMessages(
      currentConversationId
    );
  }
}

function renderConversations(){

  const container =
    $("conversationList");

  const search =
    $("searchInput").value
      .trim()
      .toLowerCase();

  let list =
    conversations.filter(c =>
      String(c.title || "محادثة جديدة")
        .toLowerCase()
        .includes(search)
    );

  if(!list.length){

    container.innerHTML =
      `<div class="empty-state">
        لا توجد محادثات بعد.
      </div>`;

    return;
  }

  container.innerHTML =
    list.map(c=>{

      const title =
        c.title ||
        "محادثة جديدة";

      return `
        <div
          class="conversation-item
          ${c.id === currentConversationId ? "active" : ""}"
        >

          <div
            class="conversation-main"
            onclick="openConversation('${c.id}')"
          >

            <div class="conversation-icon">
              ${c.pinned ? "📌" : "💬"}
            </div>

            <div class="conversation-info">

              <div class="conversation-title">
                ${escapeHTML(title)}
              </div>

              <div class="conversation-date">
                ${formatDate(c.updated_at)}
              </div>

            </div>

          </div>

          <div class="conversation-menu">
            <button
              type="button"
              onclick="conversationMenu(event,'${c.id}')"
              aria-label="إجراءات المحادثة"
            >⋮</button>
            <div
              id="conversationActions-${c.id}"
              class="conversation-actions"
            >
              <button type="button" onclick="conversationAction(event,'${c.id}','rename')">✏️ إعادة تسمية</button>
              <button type="button" onclick="conversationAction(event,'${c.id}','pin')">${c.pinned ? "📌 إلغاء التثبيت" : "📌 تثبيت"}</button>
              <button type="button" class="danger" onclick="conversationAction(event,'${c.id}','delete')">🗑️ حذف</button>
            </div>
          </div>

        </div>
      `;

    }).join("");
}

async function createConversation(title="محادثة جديدة"){

  if(!currentUser){

    openAuth();
    throw new Error("AUTH_REQUIRED");
  }

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .insert({
        user_id:currentUser.id,
        title,
        pinned:false,
        archived:false,
        build_used:false
      })
      .select()
      .single();

  if(error) throw error;

  conversations.unshift(data);

  currentConversationId = data.id;

  renderConversations();
  syncBuildButtonState();

  clearMessages();

  return data;
}

async function newChat(){

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  try{

    await createConversation();

    closeSidebar();

    setStatus("محادثة جديدة.");

  }catch(error){

    console.error(error);

    showToast("تعذر إنشاء المحادثة.");
  }
}

async function openConversation(id){

  if(!currentUser) return;

  currentConversationId = id;

  renderConversations();
  syncBuildButtonState();

  await loadMessages(id);

  closeSidebar();
}

async function loadMessages(conversationId){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq("conversation_id",conversationId)
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);
    showToast("تعذر تحميل الرسائل.");
    return;
  }

  renderMessages(data || []);
}

function clearMessages(){

  $("messages").innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">A</div>
      <h1>مرحباً بك في Aizen AI Builder</h1>
      <p>
        اكتب فكرتك وسيساعدك Aizen في بناء مشروعك.
      </p>
    </div>
  `;
}

function renderMessages(messages){

  const container =
    $("messages");

  if(!messages.length){

    clearMessages();
    return;
  }

  container.innerHTML =
    messages.map(messageHTML).join("");

  scrollMessages();
}

function messageHTML(message){

  const user =
    message.role === "user";

  return `
    <div class="message ${user ? "user" : "assistant"}">

      <div class="message-avatar">
        ${user ? "أنت" : "A"}
      </div>

      <div class="message-content">
        ${escapeHTML(message.content)}
      </div>

    </div>
  `;
}

function addMessageToUI(role,content){

  const welcome =
    $("messages").querySelector(".welcome");

  if(welcome) welcome.remove();

  const div =
    document.createElement("div");

  div.className =
    `message ${role === "user" ? "user" : "assistant"}`;

  div.innerHTML = `
    <div class="message-avatar">
      ${role === "user" ? "أنت" : "A"}
    </div>

    <div class="message-content"></div>
  `;

  div.querySelector(
    ".message-content"
  ).textContent = content;

  $("messages").appendChild(div);

  scrollMessages();

  return div;
}

function scrollMessages(){

  const box =
    $("messages");

  box.scrollTop =
    box.scrollHeight;
}


/* =========================================================
   CONVERSATION ACTIONS
========================================================= */

async function closeConversationMenus(exceptId=null){
  document.querySelectorAll(".conversation-actions.open").forEach(menu=>{
    if(!exceptId || menu.id !== "conversationActions-"+exceptId){
      menu.classList.remove("open");
    }
  });
}

function conversationMenu(event,id){
  event.stopPropagation();
  const menu=$("conversationActions-"+id);
  if(!menu) return;
  const willOpen=!menu.classList.contains("open");
  closeConversationMenus(id);
  menu.classList.toggle("open",willOpen);
}

async function conversationAction(event,id,action){
  event.stopPropagation();
  const conversation=conversations.find(c=>c.id===id);
  if(!conversation) return;
  closeConversationMenus();

  try{
    if(action==="rename"){
      const title=prompt("الاسم الجديد:",conversation.title||"محادثة جديدة");
      if(title===null) return;
      const clean=title.trim();
      if(!clean){
        showToast("اكتب اسماً للمحادثة.");
        return;
      }
      await updateConversation(id,{title:clean.slice(0,120)});
      showToast("تمت إعادة تسمية المحادثة.");
      return;
    }
    if(action==="pin"){
      const next=!Boolean(conversation.pinned);
      await updateConversation(id,{pinned:next});
      showToast(next ? "تم تثبيت المحادثة." : "تم إلغاء تثبيت المحادثة.");
      return;
    }
    if(action==="delete"){
      if(!confirm("هل تريد حذف هذه المحادثة؟")) return;
      await deleteConversation(id);
    }
  }catch(error){
    console.error(error);
    showToast(error?.message||"تعذر تنفيذ الإجراء.");
  }
}

document.addEventListener("click",closeConversationMenus);

async function updateConversation(id,updates){

  const {data,error} =
    await supabaseClient
      .from("conversations")
      .update(updates)
      .eq("id",id)
      .eq("user_id",currentUser.id)
      .select()
      .single();

  if(error){

    showToast("تعذر تحديث المحادثة.");
    return;
  }

  const index =
    conversations.findIndex(
      c=>c.id === id
    );

  if(index !== -1){
    conversations[index] = data;
  }

  renderConversations();
}

async function deleteConversation(id){

  const {error:messageError} =
    await supabaseClient
      .from("messages")
      .delete()
      .eq("conversation_id",id)
      .eq("user_id",currentUser.id);

  if(messageError){

    console.error(messageError);
  }

  const {error} =
    await supabaseClient
      .from("conversations")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){

    showToast("تعذر حذف المحادثة.");
    return;
  }

  conversations =
    conversations.filter(
      c=>c.id !== id
    );

  if(currentConversationId === id){

    currentConversationId = null;
    clearMessages();
  }

  renderConversations();

  showToast("تم حذف المحادثة.");
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(generating) return;

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  const attachmentPrompt =
    pendingAttachments.length
      ? "\n\n[ملفات مرفقة]\n" +
        pendingAttachments.map(
          item =>
            "--- FILE: " + item.name + " ---\n" +
            item.content
        ).join("\n\n") +
        "\n[نهاية الملفات]"
      : "";

  const buildTypeInstruction =
    "[نوع المشروع المختار: " + typeLabel + " | build_type=" + type + "]\n" +
    "ابنِ المشروع على أساس هذا النوع. نفّذ الملفات والتعديلات المطلوبة فعلياً، وراعِ الواجهة وتجربة المستخدم والأمان والاستجابة حسب نوع المشروع.\n" +
    "[نهاية نوع المشروع]\n\n";

  const messageForAI =
    buildTypeInstruction + text + attachmentPrompt;

  if(!messageForAI) return;

  try{

    let conversation;

    if(currentConversationId){

      conversation =
        conversations.find(
          c=>c.id === currentConversationId
        );
    }

    if(!conversation){

      conversation =
        await createConversation(
          text.slice(0,60)
        );
    }

    const conversationId =
      conversation.id;

    const {error:insertError} =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"user",
          content:messageForAI,
          metadata:{
            attachments:
              pendingAttachments.map(
                item=>item.name
              )
          }
        });

    if(insertError)
      throw insertError;

    addMessageToUI(
      "user",
      messageForAI
    );

    input.value = "";
    autoResizeTextarea();
    clearAttachments();

    if(
      !conversation.title ||
      conversation.title === "محادثة جديدة"
    ){

      await updateConversation(
        conversationId,
        {
          title:text.slice(0,60)
        }
      );
    }

    await requestAI(
      conversationId,
      false,
      messageForAI
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "تعذر إرسال الرسالة."
    );
  }
}


/* =========================================================
   AI REQUEST / SSE
========================================================= */

async function requestAI(
  conversationId,
  isBuild,
  currentMessage = ""
){

  if(!currentSession){

    const {data} =
      await supabaseClient.auth.getSession();

    currentSession =
      data.session;
  }

  if(!currentSession){

    showToast("انتهت جلسة الدخول.");
    return;
  }

  generating = true;

  $("sendButton").disabled = true;
  $("buildButton").disabled = true;

  $("stopButton").style.display =
    "inline-block";

  setStatus(
    isBuild
      ? "Aizen يقوم ببناء المشروع..."
      : "Aizen يفكر..."
  );

  abortController =
    new AbortController();

  const assistantElement =
    addMessageToUI(
      "assistant",
      ""
    );

  const contentElement =
    assistantElement.querySelector(
      ".message-content"
    );

  let fullText = "";

  try{

    const response =
      await fetch(
        `${BACKEND_URL}/api/chat`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${currentSession.access_token}`
          },

          body:JSON.stringify({
            conversationId,
            message:String(currentMessage || ""),
            build:isBuild
          }),

          signal:
            abortController.signal
        }
      );

    if(!response.ok){

      let errorMessage = `HTTP ${response.status}`;

      try{
        const errorData =
          await response.json();

        errorMessage =
          errorData?.message ||
          errorData?.error ||
          errorMessage;
      }catch{
        try{
          const errorText =
            await response.text();

          if(errorText.trim()){
            errorMessage = errorText;
          }
        }catch{}
      }

      throw new Error(errorMessage);
    }

    if(!response.body){

      throw new Error(
        "الخادم لم يرجع Stream."
      );
    }

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    while(true){

      const {value,done} =
        await reader.read();

      if(done) break;

      buffer +=
        decoder.decode(
          value,
          {stream:true}
        );

      const parts =
        buffer.split(/\n\n/);

      buffer =
        parts.pop() || "";

      const events =
        parts
          .map(part => part.trim())
          .filter(Boolean);

      for(const rawEvent of events){

        const lines =
          rawEvent.split("\n");

        let eventName = "";
        let dataText = "";

        for(const line of lines){

          if(line.startsWith("event:")){
            eventName =
              line.slice(6).trim();
          }else if(line.startsWith("data:")){
            dataText +=
              line.slice(5).trim();
          }

        }

        if(!dataText) continue;

        if(dataText === "[DONE]") continue;

        let data = null;

        try{
          data = JSON.parse(dataText);
        }catch{
          data = null;
        }

        if(eventName === "error"){

          throw new Error(
            data?.message ||
            "حدث خطأ أثناء توليد الرد."
          );
        }

        if(eventName === "done" ||
           eventName === "complete"){
          continue;
        }

        const delta =
          data?.text ??
          data?.delta ??
          data?.content ??
          "";

        if(delta){

          fullText +=
            String(delta);

          contentElement.textContent =
            fullText;

          scrollMessages();
        }
      }
    }

    if(!fullText){

      fullText =
        "لم يصل رد من Aizen.";

      contentElement.textContent =
        fullText;
    }

    const {error:saveError} =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"assistant",
          content:fullText,
          metadata:{
            build:isBuild
          }
        });

    if(saveError)
      console.error(saveError);

    await supabaseClient
      .from("conversations")
      .update({
        updated_at:
          new Date().toISOString(),
        ...(isBuild
          ? {
              build_used:true,
              build_used_at:
                new Date().toISOString()
            }
          : {})
      })
      .eq("id",conversationId)
      .eq("user_id",currentUser.id);

    await loadConversations();

    setStatus(
      isBuild
        ? "اكتمل البناء."
        : "تم الرد."
    );

  }catch(error){

    if(error.name === "AbortError"){

      setStatus("تم إيقاف التوليد.");

      return;
    }

    console.error(error);

    contentElement.textContent =
      `حدث خطأ: ${error.message}`;

    setStatus("حدث خطأ.");
  }finally{

    generating = false;

    $("sendButton").disabled = false;

    const activeConversation =
      conversations.find(
        c=>c.id === conversationId
      );

    $("buildButton").disabled =
      Boolean(activeConversation?.build_used);

    $("stopButton").style.display =
      "none";

    abortController = null;
  }
}


/* =========================================================
   BUILD
========================================================= */

function openBuildTypeModal(){
  if(generating) return;
  if(!currentUser){ openAuth(); showToast("سجّل الدخول أولاً."); return; }
  const button = $("buildButton");
  if(button && button.disabled) return;
  $("buildTypeModal").classList.remove("hidden");
}
function closeBuildTypeModal(){ $("buildTypeModal").classList.add("hidden"); }
function confirmBuildType(type){
  const labels={website:"موقع ويب",telegram_bot:"بوت Telegram",game:"لعبة",app:"تطبيق",api:"API / Backend",other:"مشروع مخصص"};
  closeBuildTypeModal();
  runBuild(type,labels[type] || "مشروع مخصص");
}
async function runBuild(type,typeLabel){

  if(generating) return;

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  const attachmentPrompt =
    pendingAttachments.length
      ? "\n\n[ملفات مرفقة]\n" +
        pendingAttachments.map(
          item =>
            "--- FILE: " + item.name + " ---\n" +
            item.content
        ).join("\n\n") +
        "\n[نهاية الملفات]"
      : "";

  const messageForAI =
    text + attachmentPrompt;

  if(
    !currentConversationId &&
    !messageForAI
  ){

    showToast(
      "اكتب فكرة المشروع أو أرفق ملفات أولاً."
    );

    return;
  }

  try{

    let conversation =
      currentConversationId
        ? conversations.find(
            c=>c.id === currentConversationId
          )
        : null;

    if(
      conversation &&
      conversation.build_used
    ){
      showToast("تم استخدام Build لهذه المحادثة مسبقاً. اضغط «محادثة جديدة» للمتابعة.");
      return;
    }

    if(!conversation){

      conversation =
        await createConversation(
          (text ||
            pendingAttachments[0]?.name ||
            "مشروع جديد"
          ).slice(0,60)
        );

      if(messageForAI){

        const {error} =
          await supabaseClient
            .from("messages")
            .insert({
              conversation_id:conversation.id,
              user_id:currentUser.id,
              role:"user",
              content:messageForAI,
              metadata:{
                attachments:
                  pendingAttachments.map(
                    item=>item.name
                  )
              }
            });

        if(error) throw error;

        addMessageToUI(
          "user",
          messageForAI
        );

        input.value = "";
        autoResizeTextarea();
        clearAttachments();
      }
    }else if(messageForAI){

      const {error} =
        await supabaseClient
          .from("messages")
          .insert({
            conversation_id:conversation.id,
            user_id:currentUser.id,
            role:"user",
            content:messageForAI,
            metadata:{
              attachments:
                pendingAttachments.map(
                  item=>item.name
                )
            }
          });

      if(error) throw error;

      addMessageToUI(
        "user",
        messageForAI
      );

      if(
        !conversation.title ||
        conversation.title === "محادثة جديدة"
      ){
        await updateConversation(
          conversation.id,
          {
            title:
              (text ||
                pendingAttachments[0]?.name ||
                "مشروع جديد"
              ).slice(0,60)
          }
        );
      }

      input.value = "";
      autoResizeTextarea();
      clearAttachments();
    }

    await requestAI(
      conversation.id,
      true,
      messageForAI
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "تعذر بدء البناء."
    );
  }
}

function stopGeneration(){

  if(
    generating &&
    abortController
  ){

    abortController.abort();
  }
}


/* =========================================================
   PROJECTS
========================================================= */

async function loadProjects(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("projects")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("updated_at",{ascending:false});

  if(error){

    console.error(error);
    showToast("تعذر تحميل المشاريع.");
    return;
  }

  projects =
    data || [];

  renderProjects();
}

function renderProjects(){

  const container =
    $("projectList");

  if(!projects.length){

    container.innerHTML = `
      <div class="empty-state">
        لا توجد مشاريع.
        <br><br>
        يمكنك إنشاء مشروع جديد.
        <br><br>
        <button
          class="build-button"
          onclick="openProjectModal()"
        >
          ＋ مشروع
        </button>
      </div>
    `;

    return;
  }

  container.innerHTML =
    projects.map(project=>`

      <div class="project-item">

        <div
          class="project-name"
          onclick="openProject('${project.id}')"
        >
          📁 ${escapeHTML(project.name)}
        </div>

        <div class="project-type">
          ${escapeHTML(project.type || "Project")}
        </div>

        <div class="project-actions">

          <button
            onclick="openProject('${project.id}')"
          >
            فتح
          </button>

          <button
            onclick="deleteProject('${project.id}')"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");
}

function openProjectModal(){
  $("projectModal")
    .classList
    .remove("hidden");
}

function closeProjectModal(){
  $("projectModal")
    .classList
    .add("hidden");
}

async function createProject(){

  if(!currentUser){

    openAuth();
    return;
  }

  const name =
    $("projectName").value.trim();

  const type =
    $("projectType").value.trim() ||
    "Web";

  const description =
    $("projectDescription")
      .value
      .trim();

  if(!name){

    showToast("أدخل اسم المشروع.");
    return;
  }

  try{

    const {data,error} =
      await supabaseClient
        .from("projects")
        .insert({
          user_id:currentUser.id,
          name,
          type,
          description,
          status:"draft"
        })
        .select()
        .single();

    if(error) throw error;

    projects.unshift(data);

    renderProjects();

    $("projectName").value = "";
    $("projectType").value = "";
    $("projectDescription").value = "";

    closeProjectModal();

    showSidebarTab("projects");

    showToast("تم إنشاء المشروع.");

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "تعذر إنشاء المشروع."
    );
  }
}

function openProject(id){

  const project =
    projects.find(
      p=>p.id === id
    );

  if(!project) return;

  currentProjectId = id;

  showSidebarTab("projects");

  setStatus(
    `المشروع الحالي: ${project.name}`
  );

  showToast(
    `تم فتح ${project.name}`
  );
}

async function deleteProject(id){

  const project =
    projects.find(
      p=>p.id === id
    );

  if(!project) return;

  if(
    !confirm(
      `حذف المشروع "${project.name}"؟`
    )
  ) return;

  const {error} =
    await supabaseClient
      .from("projects")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if(error){

    showToast(
      error.message ||
      "تعذر حذف المشروع."
    );

    return;
  }

  projects =
    projects.filter(
      p=>p.id !== id
    );

  if(currentProjectId === id)
    currentProjectId = null;

  renderProjects();

  showToast("تم حذف المشروع.");
}


/* =========================================================
   FILE UPLOAD UI
========================================================= */

function triggerFileUpload(){

  if(!currentUser){

    openAuth();
    showToast("سجّل الدخول أولاً.");
    return;
  }

  $("fileInput").click();
}

$("fileInput").addEventListener(
  "change",
  handleFileSelection
);

function isAllowedTextFile(file){

  const name =
    String(file.name || "").toLowerCase();

  const blocked = [
    ".env",
    ".pem",
    ".key",
    ".p12",
    ".pfx",
    ".crt",
    ".der"
  ];

  if(
    blocked.some(ext =>
      name === ext || name.endsWith(ext)
    )
  ){
    return false;
  }

  const textExtensions = [
    ".js",".mjs",".cjs",".ts",".tsx",".jsx",
    ".html",".htm",".css",".scss",".sass",
    ".json",".jsonc",".md",".txt",".xml",
    ".yaml",".yml",".toml",".ini",
    ".py",".java",".kt",".kts",".go",".rs",
    ".c",".h",".cpp",".hpp",".cc",".cs",
    ".php",".rb",".swift",".dart",
    ".sql",".sh",".bash"
  ];

  return textExtensions.some(
    ext => name.endsWith(ext)
  );
}

async function handleFileSelection(event){

  if(!currentUser){
    openAuth();
    event.target.value = "";
    return;
  }

  const files =
    Array.from(event.target.files || []);

  event.target.value = "";

  if(!files.length) return;

  const maxFiles = 10;
  const maxFileBytes = 300 * 1024;
  const maxTotalBytes = 1024 * 1024;

  let accepted = 0;

  for(const file of files){

    if(accepted >= maxFiles){
      showToast("الحد الأقصى 10 ملفات في الرسالة.");
      break;
    }

    if(!isAllowedTextFile(file)){
      showToast("تم تجاهل الملف غير النصي أو الحساس: " + file.name);
      continue;
    }

    if(file.size > maxFileBytes){
      showToast("الملف كبير جداً: " + file.name);
      continue;
    }

    if(
      pendingAttachments.some(
        item => item.name === file.name
      )
    ){
      continue;
    }

    const nextTotal =
      pendingAttachments.reduce(
        (sum,item) => sum + item.size,
        0
      ) + file.size;

    if(nextTotal > maxTotalBytes){
      showToast("تجاوزت الملفات حد 1MB للرسالة.");
      break;
    }

    try{

      const content =
        await file.text();

      pendingAttachments.push({
        name:file.name,
        size:file.size,
        content
      });

      accepted++;

    }catch(error){

      console.error(error);
      showToast("تعذر قراءة الملف: " + file.name);
    }
  }

  renderAttachments();

  if(accepted){
    setStatus(
      "تمت إضافة " + accepted + " ملف للرسالة."
    );
  }
}

function renderAttachments(){

  const container =
    $("attachmentList");

  if(!container) return;

  if(!pendingAttachments.length){
    container.innerHTML = "";
    return;
  }

  container.innerHTML =
    pendingAttachments
      .map((item,index)=>
        '<div class="attachment-chip">' +
          '<span title="' + escapeHTML(item.name) + '">' +
            '📄 ' + escapeHTML(item.name) +
          '</span>' +
          '<button type="button" class="attachment-remove" ' +
            'onclick="removeAttachment(' + index + ')" ' +
            'aria-label="إزالة الملف">×</button>' +
        '</div>'
      )
      .join("");
}

function removeAttachment(index){

  if(
    index < 0 ||
    index >= pendingAttachments.length
  ) return;

  pendingAttachments.splice(index,1);
  renderAttachments();

  setStatus(
    pendingAttachments.length
      ? "متبقي " + pendingAttachments.length + " ملف."
      : "Aizen AI جاهز للعمل."
  );
}

function clearAttachments(){

  pendingAttachments = [];
  renderAttachments();
}
