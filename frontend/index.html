<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aizen AI Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid #252b3a;
      background: #111625;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #7c3aed;
    }

    .types {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .type {
      padding: 14px;
      border: 1px solid #252b3a;
      border-radius: 12px;
      background: #111625;
      color: white;
      cursor: pointer;
    }

    .type.selected {
      border-color: #7c3aed;
      background: #1b1233;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #7c3aed;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }

    #status {
      margin-top: 20px;
      color: #a78bfa;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 AIZEN AI</h1>

    <div class="subtitle">
      ابنِ تطبيقك أو بوتك باستخدام الذكاء الاصطناعي
    </div>

    <textarea
      id="idea"
      placeholder="اكتب فكرة المشروع هنا..."></textarea>

    <div class="types">
      <div class="type selected" onclick="selectType(this, 'Website')">🌐 Website</div>
      <div class="type" onclick="selectType(this, 'Telegram Bot')">🤖 Telegram</div>
      <div class="type" onclick="selectType(this, 'Discord Bot')">💬 Discord</div>
      <div class="type" onclick="selectType(this, 'Android App')">📱 Android</div>
      <div class="type" onclick="selectType(this, 'Python')">🐍 Python</div>
      <div class="type" onclick="selectType(this, 'Node.js')">🟢 Node.js</div>
    </div>

    <button onclick="createProject()">
      🚀 إنشاء المشروع
    </button>

    <div id="status"></div>

  </div>

  <script>
    let projectType = "Website";

    function selectType(element, type) {
      projectType = type;

      document.querySelectorAll(".type").forEach(el => {
        el.classList.remove("selected");
      });

      element.classList.add("selected");

      document.getElementById("status").textContent =
        "تم اختيار: " + type;
    }

    async function createProject() {
      const idea = document.getElementById("idea").value.trim();
      const status = document.getElementById("status");

      if (!idea) {
        status.textContent = "❌ اكتب فكرة المشروع أولاً";
        return;
      }

      status.textContent = "🔄 جاري إرسال المشروع...";

      try {
        const response = await fetch(
          "https://aizen-ai-builder.onrender.com/api/create",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              idea: idea,
              type: projectType
            })
          }
        );

        const data = await response.json();

        if (data.success) {
          status.textContent = "✅ تم إرسال المشروع بنجاح";
        } else {
          status.textContent = "❌ " + (data.error || "حدث خطأ");
        }

      } catch (error) {
        status.textContent = "❌ تعذر الاتصال بالسيرفر";
      }
    }
  </script>

</body>
</html>
