services:
  aizen-model:
    image: ollama/ollama:latest
    container_name: aizen-local-model
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - aizen-models:/root/.ollama
    entrypoint: ["/bin/sh","-c"]
    command: ["ollama serve & pid=$$!; sleep 5; ollama pull qwen2.5-coder:3b; wait $$pid"]

volumes:
  aizen-models:
